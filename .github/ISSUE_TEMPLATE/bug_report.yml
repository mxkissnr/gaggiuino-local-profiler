name: Bug Report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report a bug! Please fill in the details below."

  - type: input
    id: version
    attributes:
      label: App version
      description: Home Assistant → Settings → Apps → Gaggiuino Local Profiler (or the version shown at the bottom of the app's sidebar)
      placeholder: "e.g. 3.3.0"
    validations:
      required: true

  - type: dropdown
    id: firmware
    attributes:
      label: Machine firmware
      options:
        - Gaggiuino
        - GaggiMate
        - Both
        - Not relevant
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Install type
      options:
        - Home Assistant app
        - Home Assistant dev app
        - Standalone Docker
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "e.g. 2026.10.0"

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click on …
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "The app's own log (Home Assistant → Settings → Apps → Gaggiuino Local Profiler → Log), Home Assistant's log, or the browser console."
      render: text
