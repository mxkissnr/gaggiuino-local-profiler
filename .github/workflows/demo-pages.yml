# Builds the static browser demo (#1193) and deploys it to GitHub Pages.
# Demo fixtures are regenerated from the sanitized demo backup on every
# run via `npm run demo:fixtures` — they are never committed to the repo.

name: Demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'gaggiuino-local-profiler/**'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: gaggiuino-local-profiler

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: gaggiuino-local-profiler/package-lock.json

      # demo:fixtures boots the real glp-server Go binary through
      # scripts/e2e-harness.mts to record the API responses.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: gaggiuino-local-profiler/go/go.mod
          cache-dependency-path: gaggiuino-local-profiler/go/go.sum

      - name: Install dependencies
        run: npm ci

      # demo:fixtures drives headless Chromium through every view.
      - name: Install Playwright Chromium
        # apt-get (triggered by --with-deps) can hang indefinitely when the
        # runner's regional Ubuntu mirror is unreachable (#882) -- a short
        # per-attempt timeout + retry lets a single mirror hiccup self-heal
        # within this run instead of needing a manual rerun. apt gets its own
        # retries and a short HTTP timeout, and a failed attempt stops the
        # apt-get it leaves behind: `timeout` only ends npx, the root apt-get
        # survives and holds the dpkg lock, so every retry failed (#1821).
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
          for attempt in 1 2 3; do
            if timeout 300 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright install attempt $attempt/3 failed or timed out, retrying..."
            sudo pkill -x apt-get || true
            while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 2; done
            sudo dpkg --configure -a || true
            sleep 10
          done
          echo "::error::Playwright Chromium install failed after 3 attempts"
          exit 1

      - name: Generate demo fixtures
        run: npm run demo:fixtures

      - name: Build demo
        run: npm run build:demo

      - name: Smoke test demo build
        run: npm run demo:smoke

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: gaggiuino-local-profiler/demo-dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
