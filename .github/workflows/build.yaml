name: Build and publish Docker images

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    # Gitea Actions also auto-detects .github/workflows — skip there, GitHub-only.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # #1829: keyless signing of the build provenance (OIDC) and storing the
      # attestation. Nothing broader.
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: armv7
            platform: linux/arm/v7
          - arch: aarch64
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # #1596: a manual run from a branch must not publish :latest or a
      # release version tag. Only a tag whose name matches config.yaml may.
      - name: Extract version from config.yaml
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(grep '^version:' gaggiuino-local-profiler/config.yaml | sed 's/version: *"\(.*\)"/\1/')
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "v$VERSION" ]; then
            echo "::error::Refusing to publish: run from $REF_TYPE '$REF_NAME', but config.yaml says v$VERSION. Dispatch this workflow on the matching release tag."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION for ${{ matrix.arch }}"

      - name: Verify release tag signature
        env:
          TAG: ${{ github.ref_name }}
          ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
        run: |
          git fetch --no-tags --force origin "refs/tags/$TAG:refs/tags/$TAG"
          printf '%s\n' "$ALLOWED_SIGNERS" > "$RUNNER_TEMP/allowed_signers"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" verify-tag "$TAG"

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./gaggiuino-local-profiler
          platforms: ${{ matrix.platform }}
          push: true
          # #1829: SLSA provenance and an SBOM travel with the image as extra
          # OCI manifests; the attestation below signs the image digest.
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          tags: |
            ghcr.io/mxkissnr/gaggiuino-local-profiler/${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/mxkissnr/gaggiuino-local-profiler/${{ matrix.arch }}:latest
          labels: |
            org.opencontainers.image.title=GLP — Gaggiuino Local Profiler
            org.opencontainers.image.description=Local shot profiler for Gaggiuino espresso machine
            org.opencontainers.image.source=https://github.com/mxkissnr/gaggiuino-local-profiler
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=GPL-3.0-only
            io.hass.version=${{ steps.version.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.name=GLP — Gaggiuino Local Profiler

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/mxkissnr/gaggiuino-local-profiler/${{ matrix.arch }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
