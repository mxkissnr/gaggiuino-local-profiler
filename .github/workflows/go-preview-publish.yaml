# Go preview channel: every push to `go-migration` (that touches go/) builds
# the real go/Dockerfile image, pushes it to ghcr.io, and points the
# separate manifest repository (mxkissnr/glp-go-preview-app) at it -- the
# actual registry-push publish path for the Go rewrite, as opposed to
# .github/workflows/go-build.yaml (Phase 4, #901), which stays build-only CI
# (push: false, no registry login, gates this workflow's own `test` job
# below) and is NOT modified by this file. This is also NOT the Node dev
# channel: build-dev.yaml (push to `dev`) publishes gaggiuino-local-profiler/
# glp-dev-app entirely separately, with its own token
# (secrets.DEV_ADDON_REPO_TOKEN) and its own manifest repo -- the two
# channels are independent and this workflow never touches either.
#
# Same reasoning as build-dev.yaml for why the manifest lives in another
# repository, and why `version` gets rewritten there on every build: see
# that workflow's own header comment.
#
# NOT YET LIVE: publish-manifest below needs secrets.GO_PREVIEW_ADDON_REPO_TOKEN
# (a PAT with `contents: write` on mxkissnr/glp-go-preview-app) configured as
# a repo secret here before its checkout-and-push step can succeed. See
# go/README.md's "Go preview channel (publishing)" section for exactly what
# that requires and who has to do it -- the default GITHUB_TOKEN is scoped
# to this repository only and cannot write to a different one.
name: Publish Go preview channel image

on:
  push:
    branches: [go-migration]
    # #973: this image bakes in the built frontend (public-src/ -> public/)
    # as well as go/, so a `paths:` include list kept missing frontend-only
    # changes (e.g. #970/#972) -- paths-ignore, matching build-dev.yaml's own
    # pattern, means only genuinely inert pushes (docs) skip a rebuild.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# A newer push to go-migration makes an in-flight publish obsolete.
concurrency:
  group: go-preview-publish
  cancel-in-progress: true

jobs:
  # Same reasoning as build-dev.yaml's own `prep` job: computed once here
  # (UTC) and shared via output so the image tags (build jobs) and the
  # manifest's config.yaml/CHANGELOG.md (publish-manifest job) always agree
  # on the exact same value. go-preview- prefix (not dev-) keeps this
  # channel's tags visually distinct from the Node dev channel's in the
  # ghcr.io package view.
  prep:
    name: Compute go-preview build version
    # Gitea Actions also auto-detects .github/workflows — skip there, GitHub-only.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=go-preview-$(date -u +%Y%m%d_%H%M)" >> "$GITHUB_OUTPUT"

  # Same gate go-build.yaml's own `test` job runs (#901 Phase 4) -- repeated
  # here rather than depended on cross-workflow (GitHub Actions has no
  # "wait for a different workflow's job" primitive that isn't itself a
  # second trigger) so a broken go-migration push can never reach the
  # registry-push jobs below, regardless of whether go-build.yaml's own run
  # happened to pass first.
  test:
    name: go build/vet/test
    # Gitea Actions also auto-detects .github/workflows — skip there, GitHub-only.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gaggiuino-local-profiler/go
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: gaggiuino-local-profiler/go/go.mod
          cache-dependency-path: gaggiuino-local-profiler/go/go.sum

      - name: Install templ and generate
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          go generate ./...

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "::error::gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test -race
        run: go test ./... -race

  # amd64 gates publish-manifest (see build-other-archs below for why it
  # alone doesn't); the retry-after-a-pause step mirrors build-dev.yaml's
  # own #809 fix for the same ghcr.io secondary-rate-limit failure mode
  # (three arch jobs pushing the same image set concurrently).
  build-amd64:
    name: Build amd64
    needs: [prep, test]
    # Gitea Actions also auto-detects .github/workflows — skip there, GitHub-only.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./gaggiuino-local-profiler
          file: ./gaggiuino-local-profiler/go/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GLP_DEV_BUILD=${{ needs.prep.outputs.version }}
          cache-from: type=gha,scope=go-preview-amd64
          cache-to: type=gha,mode=max,scope=go-preview-amd64
          tags: |
            ghcr.io/mxkissnr/gaggiuino-local-profiler/amd64:${{ needs.prep.outputs.version }}
            ghcr.io/mxkissnr/gaggiuino-local-profiler/amd64:go-preview
          labels: |
            org.opencontainers.image.title=GLP Go Preview — Gaggiuino Local Profiler (experimental)
            org.opencontainers.image.description=Experimental Go-rewrite build of GLP — early-tester channel only
            org.opencontainers.image.source=https://github.com/mxkissnr/gaggiuino-local-profiler
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prep.outputs.version }}
            org.opencontainers.image.licenses=MIT
            io.hass.version=${{ needs.prep.outputs.version }}
            io.hass.type=addon
            io.hass.arch=amd64
            io.hass.name=GLP Go Preview — Gaggiuino Local Profiler (experimental)

      - name: Wait out the registry rate limit
        if: steps.push.outcome == 'failure'
        run: sleep 120

      - name: Build and push (retry)
        if: steps.push.outcome == 'failure'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./gaggiuino-local-profiler
          file: ./gaggiuino-local-profiler/go/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GLP_DEV_BUILD=${{ needs.prep.outputs.version }}
          cache-from: type=gha,scope=go-preview-amd64
          cache-to: type=gha,mode=max,scope=go-preview-amd64
          tags: |
            ghcr.io/mxkissnr/gaggiuino-local-profiler/amd64:${{ needs.prep.outputs.version }}
            ghcr.io/mxkissnr/gaggiuino-local-profiler/amd64:go-preview
          labels: |
            org.opencontainers.image.title=GLP Go Preview — Gaggiuino Local Profiler (experimental)
            org.opencontainers.image.description=Experimental Go-rewrite build of GLP — early-tester channel only
            org.opencontainers.image.source=https://github.com/mxkissnr/gaggiuino-local-profiler
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prep.outputs.version }}
            org.opencontainers.image.licenses=MIT
            io.hass.version=${{ needs.prep.outputs.version }}
            io.hass.type=addon
            io.hass.arch=amd64
            io.hass.name=GLP Go Preview — Gaggiuino Local Profiler (experimental)

  # Runs in parallel with build-amd64 but does NOT gate publish-manifest --
  # same #705 trade-off build-dev.yaml's own build-other-archs job accepts
  # (see that job's comment): amd64 is the maintainer's own daily HAOS box,
  # armv7/aarch64 are occasional testing, and QEMU-emulated builds of a Go
  # cross-compile's runtime-only apk-install stage are still slower than the
  # amd64 native build. arch/platform names here (aarch64/armv7, not
  # go-build.yaml's CI-internal arm64) match config.yaml's `arch:` list and
  # ghcr.io's `{arch}` path convention -- go-build.yaml's own matrix uses
  # "arm64" only as an internal untagged CI image name, never pushed
  # anywhere, so the two matrices are free to disagree on that label.
  build-other-archs:
    name: Build ${{ matrix.arch }}
    needs: [prep, test]
    # Gitea Actions also auto-detects .github/workflows — skip there, GitHub-only.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # The `arch:` list in glp-go-preview-app's config.yaml must keep
    # agreeing with this matrix plus build-amd64 above.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv7
            platform: linux/arm/v7
          - arch: aarch64
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Only the runtime stage's `apk add` (three tiny prebuilt packages)
      # executes target-arch code under this -- the Go compile itself always
      # runs natively via GOOS/GOARCH cross-compilation, see go/Dockerfile's
      # own top-of-file comment.
      - name: Set up QEMU (runtime-stage package install only, not the Go build)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./gaggiuino-local-profiler
          file: ./gaggiuino-local-profiler/go/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            GLP_DEV_BUILD=${{ needs.prep.outputs.version }}
          # Separate cache scope from go-build.yaml's own go-${arch} scope
          # (CI build-only images) so a preview publish can never poison the
          # cache that build-only CI run restores from, or vice versa.
          cache-from: type=gha,scope=go-preview-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=go-preview-${{ matrix.arch }}
          tags: |
            ghcr.io/mxkissnr/gaggiuino-local-profiler/${{ matrix.arch }}:${{ needs.prep.outputs.version }}
            ghcr.io/mxkissnr/gaggiuino-local-profiler/${{ matrix.arch }}:go-preview
          labels: |
            org.opencontainers.image.title=GLP Go Preview — Gaggiuino Local Profiler (experimental)
            org.opencontainers.image.description=Experimental Go-rewrite build of GLP — early-tester channel only
            org.opencontainers.image.source=https://github.com/mxkissnr/gaggiuino-local-profiler
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prep.outputs.version }}
            org.opencontainers.image.licenses=MIT
            io.hass.version=${{ needs.prep.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.name=GLP Go Preview — Gaggiuino Local Profiler (experimental)

      - name: Wait out the registry rate limit
        if: steps.push.outcome == 'failure'
        run: sleep 120

      - name: Build and push (retry)
        if: steps.push.outcome == 'failure'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./gaggiuino-local-profiler
          file: ./gaggiuino-local-profiler/go/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            GLP_DEV_BUILD=${{ needs.prep.outputs.version }}
          cache-from: type=gha,scope=go-preview-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=go-preview-${{ matrix.arch }}
          tags: |
            ghcr.io/mxkissnr/gaggiuino-local-profiler/${{ matrix.arch }}:${{ needs.prep.outputs.version }}
            ghcr.io/mxkissnr/gaggiuino-local-profiler/${{ matrix.arch }}:go-preview
          labels: |
            org.opencontainers.image.title=GLP Go Preview — Gaggiuino Local Profiler (experimental)
            org.opencontainers.image.description=Experimental Go-rewrite build of GLP — early-tester channel only
            org.opencontainers.image.source=https://github.com/mxkissnr/gaggiuino-local-profiler
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prep.outputs.version }}
            org.opencontainers.image.licenses=MIT
            io.hass.version=${{ needs.prep.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.name=GLP Go Preview — Gaggiuino Local Profiler (experimental)

  publish-manifest:
    name: Point go-preview manifest at the new build
    needs: [prep, build-amd64]
    # Gitea Actions also auto-detects .github/workflows — skip there, GitHub-only.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      # Checked out under its own path (not $GITHUB_WORKSPACE root) since the
      # manifest repo below is checked out there too -- both need to coexist.
      - name: Checkout main repo (for the commit log)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: main-repo
          fetch-depth: 100

      - name: Checkout go-preview manifest repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mxkissnr/glp-go-preview-app
          path: preview-app
          # GITHUB_TOKEN is scoped to this repository only, so writing to the
          # manifest repository needs a PAT with `contents: write` on it.
          # NOT secrets.DEV_ADDON_REPO_TOKEN -- that PAT only grants access
          # to glp-dev-app, and reusing it here would either fail (wrong
          # repo scope) or, worse, blur the two channels' access boundaries.
          # See this file's own header comment for what's still needed
          # before this step can succeed.
          token: ${{ secrets.GO_PREVIEW_ADDON_REPO_TOKEN }}

      # Bumps config.yaml's version to the tag just built, syncs the
      # options/schema blocks from the Node app's own config.yaml (still the
      # source of truth for what /data/options.json is expected to contain
      # -- internal/system/options.go reads the same keys the same way, see
      # go/README.md), copies go/apparmor.txt over the manifest's copy, and
      # prepends a CHANGELOG.md entry -- the same four-part update
      # build-dev.yaml's own "Update version and dev log" step performs for
      # glp-dev-app (see that step's comments for the per-part reasoning,
      # which applies identically here).
      - name: Update version, options/schema, apparmor profile and changelog
        env:
          NEW_VERSION: ${{ needs.prep.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CONFIG="preview-app/glp_go_preview/config.yaml"
          LOG="preview-app/glp_go_preview/CHANGELOG.md"
          MARKER="preview-app/.last-go-preview-build-sha"
          PROFILE_SRC="main-repo/gaggiuino-local-profiler/go/apparmor.txt"
          PROFILE_DST="preview-app/glp_go_preview/apparmor.txt"
          SYNC_SCRIPT="main-repo/gaggiuino-local-profiler/scripts/sync-dev-config.mjs"
          NODE_CONFIG="main-repo/gaggiuino-local-profiler/config.yaml"

          # Same #789 reasoning as build-dev.yaml: Supervisor reads an
          # add-on's AppArmor profile from the add-on's own directory, NOT
          # from the image, so the profile has to be copied into the
          # manifest repo alongside config.yaml or the add-on runs
          # completely unconfined. Absent source file: drop any stale copy
          # rather than leaving an outdated profile in place.
          if [ -f "$PROFILE_SRC" ]; then
            cp "$PROFILE_SRC" "$PROFILE_DST"
          else
            echo "::warning::no go/apparmor.txt in the source repo -- the go-preview add-on will run unconfined"
            rm -f "$PROFILE_DST"
          fi

          # Same #805 reasoning as build-dev.yaml: keeps the Configuration
          # tab's options/schema in step with whatever internal/system/
          # options.go actually reads from options.json, without a manual
          # edit here every time the Node app's own config.yaml changes.
          node "$SYNC_SCRIPT" "$NODE_CONFIG" "$CONFIG"

          # Anchored to the start of the line so the `version:` key is the only
          # possible match -- description text may contain the word too.
          sed -i "s|^version: .*|version: \"${NEW_VERSION}\"|" "$CONFIG"
          grep -q "^version: \"${NEW_VERSION}\"$" "$CONFIG" || {
            echo "::error::version rewrite did not apply -- refusing to commit"
            exit 1
          }

          # What's new since the last go-preview build: the marker file from
          # the previous run names that build's main-repo commit. Falls back
          # to just the current commit when there is no marker yet (first-
          # ever go-preview build) or it names a commit this shallow clone
          # doesn't have.
          PREV_SHA=""
          [ -f "$MARKER" ] && PREV_SHA=$(cat "$MARKER")
          cd main-repo
          if [ -n "$PREV_SHA" ] && git cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then
            RANGE="${PREV_SHA}..${COMMIT_SHA}"
          else
            RANGE=""
          fi
          COMMITS=""
          [ -n "$RANGE" ] && COMMITS=$(git log "$RANGE" --pretty='format:- %s (%h)' -- gaggiuino-local-profiler/go)
          [ -z "$COMMITS" ] && COMMITS=$(git log -1 --pretty='format:- %s (%h)')
          cd ..

          {
            echo "## ${NEW_VERSION} — $(date -u +%Y-%m-%d)"
            echo ""
            echo "$COMMITS"
            echo ""
            [ -f "$LOG" ] && cat "$LOG"
          } > "${LOG}.new"
          mv "${LOG}.new" "$LOG"
          echo -n "$COMMIT_SHA" > "$MARKER"

          # Already pointing at this build and logged: git commit exits 1 on
          # an empty commit, which would fail the job for a state that is
          # actually correct (e.g. a re-run after fixing the PAT).
          cd preview-app
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A glp_go_preview .last-go-preview-build-sha
          if git diff --cached --quiet; then
            echo "Already up to date with ${NEW_VERSION} -- nothing to commit"
            exit 0
          fi
          git commit -m "chore(go-preview): point go-preview app at ${NEW_VERSION} (${COMMIT_SHA:0:7})"
          git push
