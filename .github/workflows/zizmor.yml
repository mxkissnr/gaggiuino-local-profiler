name: zizmor

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

# #2156: a newer commit cancels the older run of the same pull request. Push runs on dev
# get a group of their own (run id) and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Workflow lint (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Findings fail the run. Runs on every pull request so it can be a
      # required check. Accepted findings are annotated inline or configured
      # in .github/zizmor.yml, each with a reason.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.31.1
          advanced-security: false
          annotations: true
