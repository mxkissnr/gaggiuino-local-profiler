name: zizmor

on:
  pull_request:
    paths:
      - '.github/**'
  push:
    branches: [dev]
    paths:
      - '.github/**'

permissions:
  contents: read

jobs:
  zizmor:
    name: Workflow lint (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Report-only (not a required check): findings show as annotations and
      # in the log, they do not fail the run.
      - name: Run zizmor
        continue-on-error: true
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.31.1
          advanced-security: false
          annotations: true
