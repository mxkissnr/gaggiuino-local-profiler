# Dev channel: every push to `dev` publishes a container image and points the
# separate manifest repository (mxkissnr/glp-dev-app) at it, so the
# maintainer can test unreleased code on a real Home Assistant instance
# without touching the app that users run.
#
# Why the manifest lives in another repository at all: Home Assistant shows
# every app listed in a repository's root to everyone who has added that
# repository. Putting a dev app next to the stable one here would offer it
# to all users. A separate repository keeps it invisible unless deliberately
# added.
#
# Why this workflow rewrites `version` over there: Home Assistant pulls
# `image:{version}` and only offers an update when `version` changes. A fixed
# tag like `:dev` would be pulled once and then never refreshed, so each build
# gets its own immutable tag and the manifest is bumped to match.
name: Build dev channel image

on:
  push:
    branches: [dev]
    # Documentation-only pushes to dev don't change the image.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# A newer push to dev makes an in-flight build obsolete.
concurrency:
  group: build-dev
  cancel-in-progress: true

jobs:
  # #689: the version string used to be dev-<run_number> (e.g. dev-21) -- an
  # opaque sequential counter that doesn't say when a build actually
  # happened. Computed once here (UTC) and shared via output so the image
  # tag (build job) and the manifest's config.yaml/CHANGELOG.md
  # (publish-manifest job) always agree on the exact same value.
  prep:
    name: Compute dev build version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=dev-$(date -u +%Y%m%d_%H%M)" >> "$GITHUB_OUTPUT"

  # #705: split off from the armv7/aarch64 matrix below and NOT in
  # publish-manifest's `needs` -- amd64 is the maintainer's own daily HAOS
  # box (per this workflow's original single-arch design), so the update
  # banner shouldn't wait on two QEMU-emulated architectures (armv7 alone
  # ran 15-20+ min in the first #702 builds) that box never uses.
  build-amd64:
    name: Build amd64
    needs: prep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./gaggiuino-local-profiler
          platforms: linux/amd64
          push: true
          build-args: |
            GLP_DEV_BUILD=${{ needs.prep.outputs.version }}
          cache-from: type=gha,scope=dev-amd64
          cache-to: type=gha,mode=max,scope=dev-amd64
          tags: |
            ghcr.io/mxkissnr/gaggiuino-local-profiler/amd64:${{ needs.prep.outputs.version }}
            ghcr.io/mxkissnr/gaggiuino-local-profiler/amd64:dev
          labels: |
            org.opencontainers.image.title=GLP DEV — Gaggiuino Local Profiler (unstable)
            org.opencontainers.image.description=Unstable dev build of GLP — maintainer testing only
            org.opencontainers.image.source=https://github.com/mxkissnr/gaggiuino-local-profiler
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prep.outputs.version }}
            org.opencontainers.image.licenses=MIT
            io.hass.version=${{ needs.prep.outputs.version }}
            io.hass.type=addon
            io.hass.arch=amd64
            io.hass.name=GLP DEV — Gaggiuino Local Profiler (unstable)

  # #705: runs in parallel with build-amd64 but does NOT gate
  # publish-manifest -- these two architectures are occasional testing, not
  # the primary box this channel exists for. Accepted trade-off: someone on
  # armv7/aarch64 who updates in the window before their own arch's job here
  # finishes gets a pull failure until it catches up.
  build-other-archs:
    name: Build ${{ matrix.arch }}
    needs: prep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # The `arch:` list in glp-dev-app's config.yaml must keep agreeing with
    # this matrix plus build-amd64 above.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv7
            platform: linux/arm/v7
          - arch: aarch64
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./gaggiuino-local-profiler
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            GLP_DEV_BUILD=${{ needs.prep.outputs.version }}
          # Separate cache scope from the release build so a dev build can
          # never poison the cache the release build restores from.
          cache-from: type=gha,scope=dev-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.arch }}
          tags: |
            ghcr.io/mxkissnr/gaggiuino-local-profiler/${{ matrix.arch }}:${{ needs.prep.outputs.version }}
            ghcr.io/mxkissnr/gaggiuino-local-profiler/${{ matrix.arch }}:dev
          labels: |
            org.opencontainers.image.title=GLP DEV — Gaggiuino Local Profiler (unstable)
            org.opencontainers.image.description=Unstable dev build of GLP — maintainer testing only
            org.opencontainers.image.source=https://github.com/mxkissnr/gaggiuino-local-profiler
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prep.outputs.version }}
            org.opencontainers.image.licenses=MIT
            io.hass.version=${{ needs.prep.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.name=GLP DEV — Gaggiuino Local Profiler (unstable)

  # #705: gated on build-amd64 only, not build-other-archs -- see that job's
  # comment for why. Pointing the manifest at a version whose armv7/aarch64
  # images aren't up yet is an accepted, bounded window (see #705's issue),
  # not the "broken on every other arch" failure mode the original
  # all-archs gate was guarding against when this channel was amd64-only.
  publish-manifest:
    name: Point dev manifest at the new build
    needs: [prep, build-amd64]
    runs-on: ubuntu-latest
    steps:
      # Checked out under its own path (not $GITHUB_WORKSPACE root) since the
      # manifest repo below is checked out there too -- both need to coexist.
      # fetch-depth 100 is generous headroom for "commits since the last dev
      # push" in normal use; if that's ever exceeded the log just shows what
      # fits rather than failing, see the fallback below.
      - name: Checkout main repo (for the commit log)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: main-repo
          fetch-depth: 100

      - name: Checkout dev manifest repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mxkissnr/glp-dev-app
          path: dev-app
          # GITHUB_TOKEN is scoped to this repository only, so writing to the
          # manifest repository needs a PAT with `contents: write` on it.
          token: ${{ secrets.DEV_ADDON_REPO_TOKEN }}

      # Bumps config.yaml's version to the tag just built, and prepends a
      # CHANGELOG.md entry listing the commits that landed since the previous
      # dev build -- so testing GLP DEV doesn't require cross-referencing
      # chat history or the main repo's own commit log to know what changed.
      # #687: this used to write dev-app/DEV-LOG.md at the manifest repo's
      # root. Home Assistant Supervisor's update dialog looks for
      # CHANGELOG.md directly next to the add-on's own config.yaml (compare
      # this repo's own CHANGELOG.md, which sits right next to its
      # config.yaml) -- the old path/name meant Supervisor could never find
      # it and always showed "No changelog found".
      - name: Update version and dev log
        # Passed via env rather than interpolated into the script: the prep
        # job's output/sha are GitHub-generated and safe, but keeping every
        # workflow input out of the shell body means no future edit here can
        # become an injection.
        env:
          NEW_VERSION: ${{ needs.prep.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CONFIG="dev-app/gaggiuino_local_profiler_dev/config.yaml"
          LOG="dev-app/gaggiuino_local_profiler_dev/CHANGELOG.md"
          MARKER="dev-app/.last-dev-build-sha"
          PROFILE_SRC="main-repo/gaggiuino-local-profiler/apparmor.txt"
          PROFILE_DST="dev-app/gaggiuino_local_profiler_dev/apparmor.txt"

          # #789: Supervisor reads an add-on's AppArmor profile from the
          # add-on's own directory, NOT from the image -- so the profile has
          # to be copied into the manifest repo alongside config.yaml or the
          # dev add-on runs completely unconfined. That failure is silent and
          # actively misleading: a complain-mode validation would report an
          # empty audit log, which is indistinguishable from a clean pass, and
          # the step after a clean pass is enabling enforce for everyone.
          # Absent source file: drop any stale copy rather than leaving an
          # outdated profile in place, and say so loudly in the run.
          if [ -f "$PROFILE_SRC" ]; then
            cp "$PROFILE_SRC" "$PROFILE_DST"
          else
            echo "::warning::no apparmor.txt in the source repo -- the dev add-on will run unconfined"
            rm -f "$PROFILE_DST"
          fi

          # Anchored to the start of the line so the `version:` key is the only
          # possible match -- description text may contain the word too.
          sed -i "s|^version: .*|version: \"${NEW_VERSION}\"|" "$CONFIG"
          grep -q "^version: \"${NEW_VERSION}\"$" "$CONFIG" || {
            echo "::error::version rewrite did not apply -- refusing to commit"
            exit 1
          }

          # What's new since the last dev build: the marker file from the
          # previous run names that build's main-repo commit. Falls back to
          # just the current commit when there is no marker yet (first-ever
          # dev build) or it names a commit this shallow clone doesn't have
          # (fetch-depth exceeded, or history was rewritten) -- never fails
          # the build over a log that can only ever be a nice-to-have.
          PREV_SHA=""
          [ -f "$MARKER" ] && PREV_SHA=$(cat "$MARKER")
          cd main-repo
          if [ -n "$PREV_SHA" ] && git cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then
            RANGE="${PREV_SHA}..${COMMIT_SHA}"
          else
            RANGE=""
          fi
          COMMITS=""
          [ -n "$RANGE" ] && COMMITS=$(git log "$RANGE" --pretty='format:- %s (%h)')
          # Empty range (e.g. a workflow_dispatch re-run of the same commit)
          # or no marker at all: fall back to at least naming the current
          # commit, so an entry is never blank.
          [ -z "$COMMITS" ] && COMMITS=$(git log -1 --pretty='format:- %s (%h)')
          cd ..

          {
            echo "## ${NEW_VERSION} — $(date -u +%Y-%m-%d)"
            echo ""
            echo "$COMMITS"
            echo ""
            [ -f "$LOG" ] && cat "$LOG"
          } > "${LOG}.new"
          mv "${LOG}.new" "$LOG"
          echo -n "$COMMIT_SHA" > "$MARKER"

          # Already pointing at this build and logged: git commit exits 1 on
          # an empty commit, which would fail the job for a state that is
          # actually correct. Happens whenever this job is re-run (e.g. after
          # fixing the PAT) or the manifest was bumped by hand in the meantime.
          cd dev-app
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first, then test the index: apparmor.txt may be brand new
          # (#789's first run), and `git diff` on a worktree can't see an
          # untracked file -- it would report "nothing to commit" for exactly
          # the change this step exists to deliver. `git add -A` over the
          # add-on directory also picks up the profile's deletion.
          git add -A gaggiuino_local_profiler_dev .last-dev-build-sha
          if git diff --cached --quiet; then
            echo "Already up to date with ${NEW_VERSION} -- nothing to commit"
            exit 0
          fi
          git commit -m "chore(dev): point dev app at ${NEW_VERSION} (${COMMIT_SHA:0:7})"
          git push
