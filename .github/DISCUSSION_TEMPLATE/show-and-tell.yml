body:
  - type: markdown
    attributes:
      value: "Share your setup, a profile, a dashboard or a shot you are proud of."

  - type: textarea
    id: story
    attributes:
      label: What are you showing?
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Photos or screenshots
      description: "Drag images in here."
    validations:
      required: false

  - type: input
    id: machine
    attributes:
      label: Machine and grinder
    validations:
      required: false
