configuration:
  sync_interval:
    name: Synchronisatie-interval
    description: Hoe vaak de app de machine op nieuwe shots controleert, in minuten (1 tot 60).
  preheat_time:
    name: Opwarmtijd
    description: Hoe lang het na het inschakelen duurt voordat de machine klaar is om te zetten, in minuten (1 tot 120).
  enable_orders:
    name: Bestellingen inschakelen
    description: Schakelt het bestelsysteem in. Voegt het barista-gedeelte en ondersteuning voor klantbestelkaarten toe. Standaard uit.
  debug_logging:
    name: Foutopsporingslog
    description: Schrijft uitgebreide diagnostische berichten naar het app-log. Laat het uit voor normaal gebruik en schakel het alleen in bij het opsporen van een probleem.
  expose_api_port:
    name: API-poort vrijgeven
    description: Geeft directe toegang tot de app op poort 8099 buiten de zijbalk van Home Assistant. Als je dit uitschakelt, wordt directe toegang op poort 8099 geblokkeerd (browser en geïnstalleerde app) en werkt de eerste configuratie van de directe-URL-modus van de bestelkaart niet meer, maar blijft de app bereikbaar via de zijbalk van Home Assistant.
  allowed_hosts:
    name: Toegestane hostnamen
    description: Extra hostnamen waarop de app reageert, gescheiden door komma's. Alleen nodig als je de app via je eigen domein achter een reverse proxy bereikt.
