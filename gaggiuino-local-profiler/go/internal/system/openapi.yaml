openapi: 3.0.3
info:
  title: GLP REST API
  version: 2.0.0
  description: >
    REST API for the **Gaggiuino Local Profiler** Home Assistant add-on.
    Provides shot storage, coffee library, maintenance tracking, a barista
    orders system, and live machine data.
  contact:
    url: https://github.com/mxkissnr/gaggiuino-local-profiler

servers:
  - url: http://localhost:8099
    description: Direct port (integration, cards)
  - url: /api/hassio_ingress/gaggiuino_local_profiler
    description: HA Ingress (browser — auth via HA session, no token needed)

security:
  - tokenAuth: []

components:
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: X-GLP-Token
      description: >
        64-char hex token, auto-generated on first start, stored in
        `/data/api_token.txt`. Retrieve from `GET /api/status`.
        Requests via HA Ingress bypass this check (HA session is sufficient).
        `GET /api/status` is always public.
    tokenQueryAuth:
      type: apiKey
      in: query
      name: token
      description: >
        Same token as `tokenAuth`, accepted as a `?token=` query parameter
        instead of the `X-GLP-Token` header. Only honored on `GET
        /api/events`, since a browser-native EventSource connection can't
        set custom headers — every other route requires the header.

  schemas:

    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, example: true }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: "not found" }

    MachineProfileInput:
      type: object
      required: [name, phases]
      description: >
        Mirrors the Gaggiuino machine's own profile shape 1:1 (see
        lib/gaggiuino-proto.js). `type`/`curve` accept either the machine's
        enum name strings ("PRESSURE"/"FLOW"/"MANUAL",
        "LINEAR"/"EASE_IN"/"EASE_OUT"/"EASE_IN_OUT"/"INSTANT") or their
        numeric wire values.
      properties:
        name: { type: string }
        phases:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string, example: PRESSURE }
              target:
                type: object
                properties:
                  start: { type: number }
                  end: { type: number }
                  curve: { type: string, example: LINEAR }
                  time: { type: integer, description: milliseconds }
                  volume: { type: number }
              restriction: { type: number }
              stopConditions:
                type: object
                properties:
                  time: { type: integer, description: milliseconds }
                  pressureAbove: { type: number }
                  pressureBelow: { type: number }
                  flowAbove: { type: number }
                  flowBelow: { type: number }
                  weight: { type: number }
                  waterPumpedInPhase: { type: number }
              skip: { type: boolean }
              waterTemperature: { type: number }
        globalStopConditions:
          type: object
          properties:
            time: { type: integer, description: milliseconds }
            weight: { type: number }
            waterPumped: { type: number }
        waterTemperature: { type: number }
        recipe:
          type: object
          properties:
            coffeeIn: { type: number }
            coffeeOut: { type: number }
            ratio: { type: number }

    # ── Shots ──────────────────────────────────────────────────────────────

    Annotation:
      type: object
      description: User-supplied metadata attached to a shot.
      properties:
        rating:       { type: integer, minimum: 1, maximum: 5, nullable: true }
        coffee:       { type: string, maxLength: 200 }
        grinder:      { type: string, maxLength: 200 }
        grindSetting: { type: string, maxLength: 100 }
        dose:         { type: number, minimum: 0.1, maximum: 100, nullable: true }
        roastDate:    { type: string, format: date, maxLength: 10 }
        tds:          { type: number, minimum: 0.1, maximum: 30, nullable: true }
        notes:        { type: string, maxLength: 2000 }
        orderedBy:
          type: object
          description: Set automatically when an order is completed for this shot.
          properties:
            customer:  { type: string }
            haUserId:  { type: string }
            orderId:   { type: string }

    Shot:
      type: object
      description: >
        Raw shot record from the Gaggiuino machine, enriched with annotation
        and trash metadata by the add-on.
      properties:
        id:          { type: integer, description: Unique shot ID }
        timestamp:   { type: integer, description: Unix seconds (divide by 1 to get Date) }
        duration:    { type: integer, description: "Duration × 10 — divide by 10 for seconds" }
        profileName: { type: string }
        profile:
          type: object
          properties:
            name: { type: string }
        weight:      { type: number, description: Output weight in grams }
        annotation:
          $ref: '#/components/schemas/Annotation'
        trashedAt:   { type: integer, description: Unix ms timestamp when shot was trashed, nullable: true }

    # ── Library ────────────────────────────────────────────────────────────

    Bean:
      type: object
      required: [id, name]
      description: >
        Field set as actually accepted by POST/PUT /api/library/bean — see
        those operations for per-field length caps and sanitizer behavior
        (species/category/roastType/flavors/origins are allowlist-validated,
        not just trimmed).
      properties:
        id:         { type: integer, description: Unix ms timestamp used as ID }
        name:       { type: string, maxLength: 200 }
        roaster:    { type: string, maxLength: 200 }
        roastDate:  { type: string, format: date, maxLength: 10, description: "Mirrors the active (last) bag's roastDate" }
        notes:      { type: string, maxLength: 1000 }
        stock_g:    { type: number, nullable: true, description: "Mirrors the active (last) bag's stock_g" }
        decaf:      { type: boolean }
        enabled:    { type: boolean, description: "Manual override for the order card's bean picker (#578) — independent of stock" }
        origin:     { type: string, maxLength: 2, description: "Legacy single ISO 3166-1 alpha-2 code — first entry of origins[]" }
        origins:
          type: array
          description: Source of truth for origin (#singleOrBlend beans) — replaces the legacy `origin` field.
          items:
            type: object
            properties:
              code: { type: string, maxLength: 2 }
              pct:  { type: number, nullable: true }
        variety:       { type: string, maxLength: 200 }
        species:       { type: string, description: Allowlist-validated (e.g. arabica/robusta) }
        category:      { type: string, description: Allowlist-validated }
        process:       { type: string, maxLength: 200 }
        flavors:       { type: array, items: { type: string } }
        roastType:     { type: string, description: Allowlist-validated }
        region:        { type: string, maxLength: 200 }
        altitude_m:    { type: integer, nullable: true }
        importer:      { type: string, maxLength: 200 }
        harvest:       { type: string, maxLength: 50 }
        price_eur:     { type: number, nullable: true }
        producer:      { type: string, maxLength: 200 }
        certification: { type: string, maxLength: 200 }
        brewTempC:     { type: number, nullable: true }
        brewRatio:     { type: string, maxLength: 20 }
        brewTimeS:     { type: number, nullable: true }
        brewNotes:     { type: string, maxLength: 300 }
        batchNumber:   { type: string, maxLength: 50, description: "Write-only convenience field on create/new-bag — mirrored into the active bag, not stored top-level" }
        location:      { type: object, nullable: true, description: "Geocoded {lat,lng} from `region`, best-effort, cleared when region changes" }
        image:         { type: string, nullable: true, description: "File extension of the stored photo, if any — see GET .../image" }
        source:        { type: string, maxLength: 200, description: Import source URL domain }
        sourceUrl:     { type: string, nullable: true }
        importedAt:    { type: string, format: date, maxLength: 10 }
        bags:
          type: array
          description: Bag history — new-bag/freeze-portions/thaw-portion/adjust-frozen-portion/delete-bag operate on this.
          items:
            type: object
            properties:
              id:         { type: integer }
              roastDate:  { type: string, maxLength: 10 }
              stock_g:    { type: number, nullable: true }
              openedAt:   { type: integer, description: Unix ms }
              batchNumber: { type: string, maxLength: 50 }
              frozenPortions:
                type: array
                items:
                  type: object
                  properties:
                    id:              { type: integer }
                    frozenAt:        { type: integer, description: Unix ms }
                    portionCount:    { type: integer }
                    portionWeight_g: { type: number }
                    remainingCount:  { type: integer }
                    thawedAt:        { type: integer, nullable: true, description: Unix ms, set once remainingCount reaches 0 }
        knownGrindSettings:
          type: array
          description: "Guided Dial-In (#310) — remembered (grinder, grindSetting) pairs, see POST .../known-grind"
          items:
            type: object
            properties:
              grinder:      { type: string, maxLength: 200 }
              grindSetting: { type: string, maxLength: 50 }

    Grinder:
      type: object
      required: [id, name]
      properties:
        id:            { type: integer }
        name:          { type: string, maxLength: 200 }
        notes:         { type: string, maxLength: 1000 }
        burrType:      { type: string, maxLength: 200 }
        purchaseDate:  { type: string, maxLength: 10 }
        burrsResetAt:  { type: string, description: "ISO date/timestamp — start of the burr-wear counting window, see POST .../reset-burrs" }
        image:         { type: string, nullable: true, description: "File extension of the stored photo, if any" }
        wear:
          type: object
          description: Computed burr-wear stats (shots/grams since burrsResetAt), added on read.
          properties:
            shots: { type: integer }
            grams: { type: number, nullable: true }

    Basket:
      type: object
      required: [id, name]
      description: Portafilter basket (#635).
      properties:
        id:           { type: integer }
        name:         { type: string, maxLength: 200 }
        doseCapacity: { type: string, maxLength: 50 }
        wallType:     { type: string, enum: ["", pressurized, single-wall, precision-machined, high-flow] }
        shape:        { type: string, enum: ["", straight, tapered] }
        holeCount:    { type: string, maxLength: 50 }
        notes:        { type: string, maxLength: 1000 }
        image:        { type: string, nullable: true }
        updatedAt:    { type: integer, description: Unix ms }

    PuckScreen:
      type: object
      required: [id, name]
      description: Puck screen (#635).
      properties:
        id:        { type: integer }
        name:      { type: string, maxLength: 200 }
        thickness: { type: string, enum: ["", very-thin, thin, medium, thick] }
        material:  { type: string, maxLength: 200 }
        notes:     { type: string, maxLength: 1000 }
        image:     { type: string, nullable: true }
        updatedAt: { type: integer, description: Unix ms }

    Recipe:
      type: object
      required: [id, name]
      description: Manual brew recipe (non-espresso methods included).
      properties:
        id:            { type: integer }
        name:          { type: string, maxLength: 200 }
        brewMethod:    { type: string, enum: [espresso, aeropress, v60, french_press, moka, cold_brew, other] }
        drinkType:     { type: string, maxLength: 50 }
        targetDose_g:  { type: number, nullable: true }
        targetYield_g: { type: number, nullable: true }
        targetTime_s:  { type: number, nullable: true }
        waterTemp_c:   { type: number, nullable: true }
        water_g:       { type: number, nullable: true }
        ice_g:         { type: number, nullable: true }
        grindSize:     { type: string, maxLength: 200 }
        sourceUrl:     { type: string }
        notes:         { type: string, maxLength: 1000 }
        profileName:   { type: string, maxLength: 200 }
        beanName:      { type: string, maxLength: 200 }
        steps:
          type: array
          maxItems: 30
          items:
            type: object
            properties:
              text:       { type: string, maxLength: 500 }
              duration_s: { type: number, nullable: true }

    Milk:
      type: object
      required: [id, name]
      properties:
        id:        { type: integer }
        name:      { type: string, maxLength: 100 }
        emoji:     { type: string, default: "🥛" }
        stockMl:   { type: number }
        updatedAt: { type: integer, description: Unix ms }

    Library:
      type: object
      properties:
        beans:       { type: array, items: { $ref: '#/components/schemas/Bean' } }
        grinders:    { type: array, items: { $ref: '#/components/schemas/Grinder' } }
        baskets:     { type: array, items: { $ref: '#/components/schemas/Basket' } }
        puckScreens: { type: array, items: { $ref: '#/components/schemas/PuckScreen' } }
        recipes:     { type: array, items: { $ref: '#/components/schemas/Recipe' } }
        milks:       { type: array, items: { $ref: '#/components/schemas/Milk' } }

    # ── Maintenance ────────────────────────────────────────────────────────

    MaintenanceTask:
      type: object
      properties:
        lastDate:        { type: string, format: date, nullable: true }
        threshold_shots: { type: integer, minimum: 1, maximum: 10000, nullable: true }
        threshold_days:  { type: integer, minimum: 1, maximum: 365, nullable: true }
        shots_since:     { type: integer, description: Shots since last maintenance }
        days_since:      { type: integer, description: Days since last maintenance, nullable: true }
        pct:             { type: number, minimum: 0, maximum: 1, description: Progress toward threshold (0–1) }
        status:          { type: string, enum: [ok, warning, overdue] }

    MaintenanceStats:
      type: object
      description: >
        Keys are task names: `descaling`, `backflush`, `grouphead`,
        `gaskets`, `waterfilter`, `grinder_{id}`.
      additionalProperties:
        $ref: '#/components/schemas/MaintenanceTask'

    MaintenanceAllMachinesStats:
      type: object
      description: >
        Shape returned by GET /api/maintenance?machineId=all (#392) — distinct
        from MaintenanceStats, not a map keyed by machine.
      properties:
        all: { type: boolean, example: true }
        machines:
          type: array
          items:
            type: object
            properties:
              machineId:   { type: integer }
              machineName: { type: string }
              tasks:
                type: object
                description: Per-machine-scoped tasks only (descaling/backflush/grouphead/gaskets)
                additionalProperties: { $ref: '#/components/schemas/MaintenanceTask' }
        global:
          type: object
          description: Shared-equipment tasks (waterfilter/grinder_*), identical regardless of machine
          additionalProperties: { $ref: '#/components/schemas/MaintenanceTask' }

    MaintenanceLogEntry:
      type: object
      required: [id, ts, date, task]
      properties:
        id:        { type: integer }
        ts:        { type: integer, description: Unix ms }
        date:      { type: string, format: date }
        task:      { type: string }
        machine:   { type: string, description: Machine hostname at log time, cosmetic }
        notes:     { type: string, maxLength: 500 }
        shotCount: { type: integer }
        machineId: { type: integer }

    # ── Orders ────────────────────────────────────────────────────────────

    MenuItem:
      type: object
      required: [id, name, emoji]
      properties:
        id:        { type: string, example: "m_1716000000000" }
        name:      { type: string, maxLength: 200 }
        emoji:     { type: string, maxLength: 10 }
        trending:  { type: boolean }
        createdAt: { type: integer, description: Unix ms }
        variants:
          type: array
          items: { type: string, maxLength: 50 }
        useBeans: { type: boolean, description: Whether ordering this item prompts for a bean selection }
        useMilks: { type: boolean, description: Whether ordering this item prompts for a milk selection }
        milkMl:   { type: number, nullable: true, description: Milk demand per order, used by GET /api/orders/milk-stock }

    Order:
      type: object
      required: [id, createdAt, customer, item, status]
      properties:
        id:            { type: string, example: "ord_1716000000000_ab12" }
        createdAt:     { type: integer, description: Unix ms }
        customer:      { type: string, maxLength: 50 }
        haUserId:      { type: string, maxLength: 100 }
        item:          { type: string, description: Menu item name }
        variant:       { type: string, nullable: true, maxLength: 50, description: Selected variant, if the menu item has any }
        note:          { type: string, maxLength: 200 }
        notifyService: { type: string, nullable: true }
        status:
          type: string
          enum: [pending, accepted, done, declined]
        eta:           { type: integer, description: Minutes, nullable: true }
        acceptedAt:    { type: integer, description: Unix ms, nullable: true }
        completedAt:   { type: integer, description: Unix ms, nullable: true }
        declineReason: { type: string, nullable: true }
        shotId:        { type: integer, description: "Last shot ID when order completed — resolved from the order's own machineId (#326), not the global latest shot", nullable: true }
        machine:       { type: string, maxLength: 100, nullable: true, description: "Optional machine name/slug target as supplied by the client (#317/glp-order-card #29)" }
        machineId:     { type: integer, nullable: true, description: "machine's registry id, resolved server-side from `machine` (#326) — always set on orders placed since #326, falls back to the default machine when `machine` is unset/unmatched" }
        beanId:        { type: integer, nullable: true, description: "Library bean id for stable order-to-bean attribution (#563, glp-order-card #35). Resolved server-side against the library's actual beans — a stale/unknown id becomes null." }

    OrdersSettings:
      type: object
      properties:
        enabled:              { type: boolean }
        broadcastRecipients:
          type: array
          items: { type: string, description: "notify.* service name" }
          description: Devices notified when the shop opens/closes (#603)
        baristaNotifyService: { type: string, nullable: true, description: "notify.* service that receives new-order notifications" }
        notify_preheat_ready: { type: boolean, description: "Default true (absent = on)" }
        notify_low_stock:     { type: boolean, description: "Default true (absent = on)" }
        notify_shop_state:    { type: boolean, description: "Default true (absent = on)" }
        notify_new_order:     { type: boolean, description: "Default true (absent = on)" }
        notify_order_status:  { type: boolean, description: "Default true (absent = on)" }

    NotifyMapping:
      type: object
      description: Map of haUserId → notify service name (e.g. "notify.mobile_app_phone")
      additionalProperties: { type: string }

    # ── System ────────────────────────────────────────────────────────────

    Status:
      type: object
      description: >
        Public fields are always present; the block below marked
        "authenticated only" is omitted entirely (H1) unless the request
        carries a valid X-GLP-Token or arrives via HA Ingress.
      properties:
        shotCount:          { type: integer }
        lastSync:            { type: string, format: date-time, nullable: true }
        syncRetryCount:      { type: integer, description: "Current retry attempt (0 = normal schedule, 1–3 = backing off)" }
        machineVersion:      { type: string, nullable: true }
        syncInterval:        { type: integer, description: Minutes }
        haConnected:         { type: boolean }
        glpVersion:          { type: string }
        devBuild:            { type: string, description: "Only present on the dev-channel image build (GLP_DEV_BUILD build-arg)" }
        ordersFeature:       { type: boolean }
        exposeApiPort:       { type: boolean, description: "add-on's expose_api_port option (#803) — whether GET /api/token answers direct-port callers" }
        machineReachable:    { type: boolean, nullable: true }
        lastMachineSuccess:  { type: integer, nullable: true, description: Unix ms of the last successful poll of the default machine }
        machineOn:           { type: boolean, nullable: true, description: Default machine's tracked power-switch state }
        machineOnSince:      { type: integer, nullable: true, description: Unix ms the default machine last switched on }
        legacyMachineOptionsPending: { type: boolean, description: "True while the default machine still has an unconfirmed legacy machine_host/switch_entity add-on option (#662)" }
        installId:           { type: string, description: "Stable per-database identity (#751) — changes only when glp.db is freshly (re)created" }
        syncProgress:
          type: array
          description: Present only while at least one shot-import backfill is actively running.
          items:
            type: object
            properties:
              machineId: { type: integer }
              current:   { type: integer }
              total:     { type: integer }
        machines:
          type: array
          description: All configured machines (#317). The fields above always describe the default machine, unchanged, for backward compatibility.
          items:
            type: object
            properties:
              id:        { type: integer }
              name:      { type: string }
              type:      { type: string, enum: [gaggiuino, gaggimate] }
              isDefault: { type: boolean }
              enabled:   { type: boolean }
              reachable: { type: boolean, nullable: true, description: "Only populated for the default machine" }
              on:        { type: boolean, nullable: true }
              theme:     { type: string, nullable: true, description: "#701 accent color, synced from Settings → Machines" }
        # ── authenticated only (H1) ──────────────────────────────────────
        machineUrl:       { type: string }
        machineHostname:  { type: string }
        lastSyncError:    { type: string, nullable: true }
        lastMachineError: { type: string, nullable: true }
        switchEntity:     { type: string, nullable: true }
        isDemo:           { type: boolean, description: Whether demo data is currently seeded (#274) }

    Machine:
      type: object
      properties:
        id:           { type: integer }
        name:         { type: string }
        type:         { type: string, enum: [gaggiuino, gaggimate] }
        host:         { type: string }
        switchEntity: { type: string, nullable: true }
        isDefault:    { type: boolean }
        enabled:      { type: boolean }
        theme:        { type: string, nullable: true, description: "#701 accent color picker" }
        createdAt:    { type: integer, description: Unix ms }

    MachineInput:
      type: object
      required: [name, type, host]
      properties:
        name:         { type: string }
        type:         { type: string, enum: [gaggiuino, gaggimate] }
        host:         { type: string, description: "Hostname or host:port, e.g. gaggiuino.local or 192.168.1.50" }
        switchEntity: { type: string, nullable: true, description: "HA switch entity id for this machine's power outlet" }
        enabled:      { type: boolean, default: true }

    PreheatStatus:
      type: object
      properties:
        ready:       { type: boolean }
        elapsed:     { type: integer, description: Elapsed seconds }
        remaining:   { type: integer, description: Remaining seconds }
        pct:         { type: number, minimum: 0, maximum: 1 }
        preheatTime: { type: integer, description: Configured preheat time in minutes }
        temp:        { type: number, description: Current boiler temperature °C, nullable: true }
        targetTemp:  { type: number, description: Target boiler temperature °C, nullable: true }
        readyByTargetAt:   { type: integer, nullable: true, description: "Epoch-ms wall-clock target set via POST /api/preheat/ready-by, or null if none is pending" }
        plannedSwitchOnAt: { type: integer, nullable: true, description: "Epoch-ms when the preheat watcher will turn the switch on to hit readyByTargetAt, or null" }

    LiveData:
      type: object
      properties:
        isLive:      { type: boolean }
        profileName: { type: string }
        datapoints:
          type: array
          nullable: true
          items:
            type: object
            description: Live brew datapoint
        seq: { type: integer, description: Sequence counter — increments on each update }
        machineReachable: { type: boolean, nullable: true, description: "#655: distinguishes a powered-off machine (false) from an idle-but-reachable one (isLive:false, machineReachable:true) — without it both looked identical" }
        isSteaming: { type: boolean, description: "#902: a steam live-session is active (kept separate from isLive, which stays brew-only)" }
        steamSeq: { type: integer, description: "#902: increments when a steam session ends" }
        steamDatapoints:
          type: object
          nullable: true
          description: "#902: timeInMode/pressure/temperature arrays while steaming, null otherwise"
        isFlushing: { type: boolean, description: "#902: a flush live-session is active" }
        flushSeq: { type: integer, description: "#902: increments when a flush session ends" }
        flushDatapoints:
          type: object
          nullable: true
          description: "#902: timeInMode/pressure/temperature arrays while flushing, null otherwise"
        temperature: { type: number, nullable: true, description: "#902 idle stats: current temperature from the per-tick machineStatus, null before the first successful poll" }
        targetTemperature: { type: number, nullable: true, description: "#902 idle stats: current target temperature" }
        pressure: { type: number, nullable: true, description: "#902 idle stats: current pressure" }
        waterLevel: { type: integer, nullable: true, description: "#902 idle stats: current water level" }

    # ── Backup ────────────────────────────────────────────────────────────

    BackupBundle:
      type: object
      required: [glp_backup, version, created, shots]
      properties:
        glp_backup:      { type: boolean, example: true }
        version:         { type: string }
        created:         { type: string, format: date-time }
        sections:
          description: >
            Present only on a scoped export (see the `sections` request field
            on POST /api/backup). Absent on a full/legacy export, which is
            the default and what GET /api/backup always returns.
          type: array
          items: { type: string, enum: [shots, maintenance, orders, machines, settings, secrets] }
        shots:           { type: array, items: { $ref: '#/components/schemas/Shot' } }
        annotations:     { type: object }
        coffee_library:  { $ref: '#/components/schemas/Library' }
        blocklist:       { type: array, items: { type: integer } }
        trash:
          description: "{ [shotId]: deletedAtEpochMs }"
          type: object
        maintenance:     { type: array, items: { type: object } }
        maintenance_log: { type: array, items: { type: object } }
        orders:          { type: array, items: { type: object } }
        machines:        { type: array, items: { type: object } }
        kv:
          type: object
          properties:
            menu:            { type: array }
            orders_settings: { type: object }
            notify_mapping:  { type: object }
            import_settings: { type: object }
            mqtt_settings:
              description: Never includes username/password — see the `secrets` field for those, encrypted.
              type: object
        images:
          description: "{ [filename]: base64FileContent } — bean/grinder/basket/puck-screen photos"
          type: object
        secrets:
          $ref: '#/components/schemas/EncryptedSecrets'

    EncryptedSecrets:
      description: >
        The API token and MQTT broker username/password, AES-256-GCM
        encrypted with a passphrase supplied at export time (see
        POST /api/backup's `passphrase` field). Present only when that
        passphrase was given and there was something to encrypt. Decrypting
        requires the same passphrase again at restore time
        (POST /api/restore's `passphrase` field) — GLP never stores it.
      type: object
      properties:
        alg:        { type: string, example: aes-256-gcm-scrypt-v1 }
        salt:       { type: string, description: base64 }
        iv:         { type: string, description: base64 }
        authTag:    { type: string, description: base64 }
        ciphertext: { type: string, description: base64 }

paths:

  # ── Shots ───────────────────────────────────────────────────────────────

  /shots.json:
    get:
      tags: [Shots]
      summary: All shots (with annotations merged)
      parameters:
        - name: trash
          in: query
          description: Set to "1" to return trashed shots instead of active shots
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: Array of shots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Shot' }

  /api/shots:
    get:
      tags: [Shots]
      summary: Keyset-paginated shot list (metadata only, no curve data) (#957)
      description: >
        Newest-first, keyset-paginated list of shot METADATA — every field a
        hydrated shot has EXCEPT the `datapoints` curve blob, plus `score`,
        `usedBeanTarget` and `hasChartData`. Fetch a shot's curve data
        separately via GET /api/shots/{id}. No response here carries the
        full-history curve payload, so listing the history is O(page) not
        O(total shots). `/shots.json` is retained unchanged for existing
        consumers (full dump, timestamp-ASC, `datapoints` included).
      parameters:
        - name: limit
          in: query
          description: Page size (default 60, clamped to 1..200)
          schema: { type: integer, minimum: 1, maximum: 200, default: 60 }
        - name: cursor
          in: query
          description: Opaque pagination cursor from a previous response's `nextCursor`. Omit for the first page.
          schema: { type: string }
        - name: machine
          in: query
          description: Filter to one machine id. Omit or "all" for every machine.
          schema: { type: string }
        - name: trash
          in: query
          description: Set to "1" to page the trashed-shots list instead.
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: One page of shot metadata
          content:
            application/json:
              schema:
                type: object
                required: [shots, nextCursor, hasMore]
                properties:
                  shots:
                    type: array
                    description: >
                      Each row is a Shot with the `datapoints` curve blob removed
                      (fetch it via GET /api/shots/{id}) plus `score`,
                      `usedBeanTarget` and `hasChartData`.
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Shot'
                        - type: object
                          properties:
                            score:            { type: integer, nullable: true }
                            usedBeanTarget:   { type: boolean }
                            hasChartData:     { type: boolean, description: Whether the shot has a non-empty pressure/time curve series }
                            tempStabilityDev: { type: number, nullable: true, description: Mean absolute deviation of the temperature series from target, in °C (for the Analytics machine-comparison stability column) }
                  nextCursor:
                    type: string
                    nullable: true
                    description: Cursor for the next page, or null when hasMore is false.
                  hasMore: { type: boolean }
        "400": { description: Malformed cursor or machine parameter }

  /api/shots/last:
    get:
      tags: [Shots]
      summary: Most recent non-trashed shot
      responses:
        "200":
          description: Shot object or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Shot'
                  - type: "null"

  /api/shots/defaults:
    get:
      tags: [Shots]
      summary: Per-install defaults auto-prefilled into a new shot's annotation panel (#654)
      responses:
        "200":
          description: Defaults object
          content:
            application/json:
              schema:
                type: object
                properties:
                  drinkType:    { type: string, nullable: true }
                  coffee:       { type: string, nullable: true }
                  beanId:       { type: integer, nullable: true }
                  basketId:     { type: integer, nullable: true }
                  puckScreenId: { type: integer, nullable: true }
                  grinder:      { type: string }
                  dose:         { type: number, nullable: true }
    post:
      tags: [Shots]
      summary: Save per-install shot defaults
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                drinkType:    { type: string, nullable: true }
                coffee:       { type: string, nullable: true }
                beanId:       { type: integer, nullable: true }
                basketId:     { type: integer, nullable: true }
                puckScreenId: { type: integer, nullable: true }
                grinder:      { type: string }
                dose:         { type: number, nullable: true }
      responses:
        "200": { description: Saved defaults }
        "400": { description: Validation error }

  /api/shots/{id}:
    get:
      tags: [Shots]
      summary: Single shot by ID
      description: >
        Also includes previousShotId/previousShot (#402), the most recent
        earlier shot on the same profile with its own score/usedBeanTarget
        computed, for same-profile auto-compare.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Shot object or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Shot'
                  - type: "null"

  /api/shots/{id}/card:
    get:
      tags: [Shots]
      summary: Render a shareable PNG share-card for a shot
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [square, story], default: square } }
        - { name: accent, in: query, schema: { type: string }, description: "Hex accent color override" }
        - { name: theme, in: query, schema: { type: string }, description: "UI theme name override" }
      responses:
        "200": { description: PNG image, content: { image/png: { schema: { type: string, format: binary } } } }
        "400": { description: Invalid shot ID }
        "404": { description: Shot not found }
        "503": { description: Card rendering module not available }

  /api/shots/{id}/image:
    get:
      tags: [Shots]
      summary: Serve a shot's uploaded photo
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Image bytes, content: { image/*: { schema: { type: string, format: binary } } } }
        "404": { description: No image for this shot }
    post:
      tags: [Shots]
      summary: Upload a shot photo (raw bytes, Content-Type selects the extension)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png:  { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200": { description: "Updated shot (with score recomputed)", content: { application/json: { schema: { $ref: '#/components/schemas/Shot' } } } }
        "400": { description: Invalid shot ID, no image data, or unsupported image type }
        "404": { description: Shot not found }
    delete:
      tags: [Shots]
      summary: Remove a shot's uploaded photo
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ ok: true, shot }" }
        "400": { description: Invalid shot ID }
        "404": { description: Shot not found }

  /api/shots/{id}/annotate:
    post:
      tags: [Shots]
      summary: Save or update annotation for a shot
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Annotation' }
      responses:
        "200": { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        "400": { description: Invalid shot ID, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/shots/{id}/trash:
    post:
      tags: [Shots]
      summary: Move shot to trash (soft delete, auto-purged after 30 days)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        "400": { description: Invalid shot ID, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/shots/{id}/restore:
    post:
      tags: [Shots]
      summary: Restore shot from trash
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        "400": { description: Invalid shot ID, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/shots/{id}/delete:
    post:
      tags: [Shots]
      summary: Permanently delete a shot (adds ID to blocklist to prevent re-import)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        "404": { description: Shot not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ── Library ─────────────────────────────────────────────────────────────

  /api/library:
    get:
      tags: [Library]
      summary: Full coffee library (beans, grinders, baskets, puck screens, recipes, milks)
      description: Grinders are enriched with a computed `wear` field on read (not stored).
      responses:
        "200":
          description: Library object
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Library' }

  /api/library/beans-info:
    get:
      tags: [Library]
      summary: Lightweight bean metadata for external cards
      description: >
        All beans with their descriptive fields (no stock math). Used by the
        Lovelace shot card to enrich the shot's bean name with origin flag,
        variety and roast age. roastDate comes from the active bag, falling
        back to the bean-level date.
      responses:
        "200":
          description: Array of bean metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:        { type: integer }
                    name:      { type: string }
                    roaster:   { type: string, nullable: true }
                    origin:    { type: string, nullable: true, description: ISO 3166-1 alpha-2 country code }
                    variety:   { type: string, nullable: true }
                    process:   { type: string, nullable: true }
                    roastDate: { type: string, nullable: true }
                    decaf:     { type: boolean }

  /api/library/bean:
    post:
      tags: [Library]
      summary: Add a bean to the library
      description: >
        Accepts the full Bean field set (see the Bean schema) — name is the
        only required field; `id` is server-assigned and ignored if sent.
        Also fires a fire-and-forget geocode (if `region` given) and/or image
        download (if `imageUrl` given, not a stored field).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Bean' }
      responses:
        "200": { description: Created bean, content: { application/json: { schema: { $ref: '#/components/schemas/Bean' } } } }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "429": { description: Rate limit exceeded }

  /api/library/bean/{id}:
    put:
      tags: [Library]
      summary: Update a bean (partial — omitted fields keep their current value)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Bean' }
      responses:
        "200": { description: Updated bean, content: { application/json: { schema: { $ref: '#/components/schemas/Bean' } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/library/bean/{id}/new-bag:
    post:
      tags: [Library]
      summary: Open a new bag for a bean (pushes bag history, resets roastDate/stock_g)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roastDate:   { type: string, format: date }
                stock_g:     { type: number }
                batchNumber: { type: string, maxLength: 50 }
      responses:
        "200": { description: Updated bean, content: { application/json: { schema: { $ref: '#/components/schemas/Bean' } } } }
        "404": { description: Not found }

  /api/library/bean/{id}/freeze-portions:
    post:
      tags: [Library]
      summary: Freeze a portion of the active bag (#472) — pauses that portion's freshness clock
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [portionCount, portionWeight_g]
              properties:
                frozenAt:        { type: integer, description: "Epoch ms, default now" }
                portionCount:    { type: integer }
                portionWeight_g: { type: number }
      responses:
        "200": { description: Updated bean, content: { application/json: { schema: { $ref: '#/components/schemas/Bean' } } } }
        "400": { description: No active bag, or portionCount/portionWeight_g missing/invalid }
        "404": { description: Not found }

  /api/library/bean/{id}/thaw-portion:
    post:
      tags: [Library]
      summary: Thaw one or more remaining portions of a frozen-portion batch
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [portionId]
              properties:
                portionId: { type: integer }
                count:     { type: integer, default: 1 }
      responses:
        "200": { description: Updated bean, content: { application/json: { schema: { $ref: '#/components/schemas/Bean' } } } }
        "404": { description: Bean or frozen portion not found }

  /api/library/bean/{id}/adjust-frozen-portion:
    post:
      tags: [Library]
      summary: Correct a frozen-portion entry's weight/date/remaining count after the fact (#472)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [portionId]
              properties:
                portionId:       { type: integer }
                portionWeight_g: { type: number, minimum: 0.1, maximum: 2000 }
                frozenAt:        { type: integer, description: Epoch ms }
                remainingCount:  { type: integer, minimum: 0, description: "Set absolutely, re-clamped to [0, portionCount]" }
      responses:
        "200": { description: Updated bean, content: { application/json: { schema: { $ref: '#/components/schemas/Bean' } } } }
        "400": { description: Invalid portionWeight_g/frozenAt/remainingCount }
        "404": { description: Bean or frozen portion not found }

  /api/library/bean/{id}/bag/{bagId}:
    delete:
      tags: [Library]
      summary: Delete a bag from a bean's bag history (the last remaining bag cannot be deleted)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: bagId, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Updated bean, content: { application/json: { schema: { $ref: '#/components/schemas/Bean' } } } }
        "400": { description: Cannot delete the last bag }
        "404": { description: Not found }

  /api/library/bean/{id}/delete:
    post:
      tags: [Library]
      summary: Delete a bean (and its photo, if any)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }

  /api/library/bean/{id}/toggle-active:
    post:
      tags: [Library]
      summary: Toggle a bean's `enabled` flag (order card's bean picker override, independent of stock, #578)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Updated bean, content: { application/json: { schema: { $ref: '#/components/schemas/Bean' } } } }
        "404": { description: Not found }

  /api/library/bean/{id}/known-grind:
    post:
      tags: [Library]
      summary: Remember the winning (grinder, grindSetting) combo for a bean (Guided Dial-In, #310)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grinder, grindSetting]
              properties:
                grinder:      { type: string, maxLength: 200 }
                grindSetting: { type: string, maxLength: 50 }
      responses:
        "200": { description: Updated bean, content: { application/json: { schema: { $ref: '#/components/schemas/Bean' } } } }
        "400": { description: grinder or grindSetting missing }
        "404": { description: Not found }

  /api/library/bean/{id}/image:
    get:
      tags: [Library]
      summary: Serve a bean's photo (auto-imported or uploaded)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Image bytes, content: { image/*: { schema: { type: string, format: binary } } } }
        "404": { description: No image for this bean }
    post:
      tags: [Library]
      summary: Upload a bean photo manually (raw bytes, Content-Type selects the extension)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png:  { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200": { description: Updated bean, content: { application/json: { schema: { $ref: '#/components/schemas/Bean' } } } }
        "400": { description: No image data, or unsupported image type }
        "404": { description: Not found }

  /api/library/grinder:
    post:
      tags: [Library]
      summary: Add a grinder to the library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:         { type: string, maxLength: 200 }
                notes:        { type: string, maxLength: 1000 }
                burrType:     { type: string, maxLength: 200 }
                purchaseDate: { type: string, format: date }
                burrsResetAt: { type: string, format: date, description: "Defaults to purchaseDate if omitted" }
      responses:
        "200": { description: Created grinder, content: { application/json: { schema: { $ref: '#/components/schemas/Grinder' } } } }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "429": { description: Rate limit exceeded }

  /api/library/grinder/{id}:
    put:
      tags: [Library]
      summary: Update a grinder
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:         { type: string, maxLength: 200 }
                notes:        { type: string, maxLength: 1000 }
                burrType:     { type: string, maxLength: 200 }
                purchaseDate: { type: string, format: date }
                burrsResetAt: { type: string, format: date }
      responses:
        "200": { description: Updated grinder, content: { application/json: { schema: { $ref: '#/components/schemas/Grinder' } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/library/grinder/{id}/reset-burrs:
    post:
      tags: [Library]
      summary: Mark burrs as replaced — resets the wear counter to zero (calendar maintenance untouched)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Updated grinder (with recomputed `wear`)", content: { application/json: { schema: { $ref: '#/components/schemas/Grinder' } } } }
        "404": { description: Not found }

  /api/library/grinder/{id}/delete:
    post:
      tags: [Library]
      summary: Delete a grinder (also removes its photo and maintenance entry)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }

  /api/library/grinder/{id}/image:
    get:
      tags: [Library]
      summary: Serve a grinder's photo
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Image bytes, content: { image/*: { schema: { type: string, format: binary } } } }
        "404": { description: No image for this grinder }
    post:
      tags: [Library]
      summary: Upload a grinder photo (raw bytes, Content-Type selects the extension)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png:  { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200": { description: Updated grinder, content: { application/json: { schema: { $ref: '#/components/schemas/Grinder' } } } }
        "400": { description: No image data, or unsupported image type }
        "404": { description: Not found }

  /api/library/baskets:
    get:
      tags: [Library]
      summary: List portafilter baskets (#635)
      responses:
        "200": { description: Array of baskets, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Basket' } } } } }

  /api/library/basket:
    post:
      tags: [Library]
      summary: Add a basket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:         { type: string, maxLength: 200 }
                doseCapacity: { type: string, maxLength: 50 }
                wallType:     { type: string, enum: [pressurized, single-wall, precision-machined, high-flow] }
                shape:        { type: string, enum: [straight, tapered] }
                holeCount:    { type: string, maxLength: 50 }
                notes:        { type: string, maxLength: 1000 }
      responses:
        "200": { description: Created basket, content: { application/json: { schema: { $ref: '#/components/schemas/Basket' } } } }
        "400": { description: "name required, or invalid wallType/shape" }
        "429": { description: Rate limit exceeded }

  /api/library/basket/{id}:
    put:
      tags: [Library]
      summary: Update a basket
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:         { type: string, maxLength: 200 }
                doseCapacity: { type: string, maxLength: 50 }
                wallType:     { type: string, enum: [pressurized, single-wall, precision-machined, high-flow] }
                shape:        { type: string, enum: [straight, tapered] }
                holeCount:    { type: string, maxLength: 50 }
                notes:        { type: string, maxLength: 1000 }
      responses:
        "200": { description: Updated basket, content: { application/json: { schema: { $ref: '#/components/schemas/Basket' } } } }
        "400": { description: Invalid wallType/shape }
        "404": { description: Not found }
    delete:
      tags: [Library]
      summary: Delete a basket
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }

  /api/library/basket/{id}/image:
    get:
      tags: [Library]
      summary: Serve a basket's photo
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Image bytes, content: { image/*: { schema: { type: string, format: binary } } } }
        "404": { description: No image for this basket }
    post:
      tags: [Library]
      summary: Upload a basket photo (raw bytes, Content-Type selects the extension)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png:  { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200": { description: Updated basket, content: { application/json: { schema: { $ref: '#/components/schemas/Basket' } } } }
        "400": { description: No image data, or unsupported image type }
        "404": { description: Not found }

  /api/library/puckscreens:
    get:
      tags: [Library]
      summary: List puck screens (#635)
      responses:
        "200": { description: Array of puck screens, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PuckScreen' } } } } }

  /api/library/puckscreen:
    post:
      tags: [Library]
      summary: Add a puck screen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:      { type: string, maxLength: 200 }
                thickness: { type: string, enum: [very-thin, thin, medium, thick] }
                material:  { type: string, maxLength: 200 }
                notes:     { type: string, maxLength: 1000 }
      responses:
        "200": { description: Created puck screen, content: { application/json: { schema: { $ref: '#/components/schemas/PuckScreen' } } } }
        "400": { description: "name required, or invalid thickness" }
        "429": { description: Rate limit exceeded }

  /api/library/puckscreen/{id}:
    put:
      tags: [Library]
      summary: Update a puck screen
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:      { type: string, maxLength: 200 }
                thickness: { type: string, enum: [very-thin, thin, medium, thick] }
                material:  { type: string, maxLength: 200 }
                notes:     { type: string, maxLength: 1000 }
      responses:
        "200": { description: Updated puck screen, content: { application/json: { schema: { $ref: '#/components/schemas/PuckScreen' } } } }
        "400": { description: Invalid thickness }
        "404": { description: Not found }
    delete:
      tags: [Library]
      summary: Delete a puck screen
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }

  /api/library/puckscreen/{id}/image:
    get:
      tags: [Library]
      summary: Serve a puck screen's photo
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Image bytes, content: { image/*: { schema: { type: string, format: binary } } } }
        "404": { description: No image for this puck screen }
    post:
      tags: [Library]
      summary: Upload a puck screen photo (raw bytes, Content-Type selects the extension)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png:  { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200": { description: Updated puck screen, content: { application/json: { schema: { $ref: '#/components/schemas/PuckScreen' } } } }
        "400": { description: No image data, or unsupported image type }
        "404": { description: Not found }

  /api/library/milks:
    get:
      tags: [Library]
      summary: List milks (lightweight id/name/emoji/stockMl projection)
      responses:
        "200":
          description: Array of milks
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:      { type: integer }
                    name:    { type: string }
                    emoji:   { type: string }
                    stockMl: { type: number }

  /api/library/milk:
    post:
      tags: [Library]
      summary: Add a milk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:    { type: string, maxLength: 100 }
                emoji:   { type: string, default: "🥛" }
                stockMl: { type: number, default: 0 }
      responses:
        "200": { description: Created milk, content: { application/json: { schema: { $ref: '#/components/schemas/Milk' } } } }
        "400": { description: name required }
        "429": { description: Rate limit exceeded }

  /api/library/milk/{id}:
    put:
      tags: [Library]
      summary: Update a milk
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:    { type: string, maxLength: 100 }
                emoji:   { type: string }
                stockMl: { type: number }
      responses:
        "200": { description: Updated milk, content: { application/json: { schema: { $ref: '#/components/schemas/Milk' } } } }
        "404": { description: Not found }
    delete:
      tags: [Library]
      summary: Delete a milk
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }

  /api/library/milk/{id}/deduct:
    post:
      tags: [Library]
      summary: Deduct milk stock (e.g. after preparing a drink)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ml], properties: { ml: { type: number, minimum: 0.01 } } }
      responses:
        "200": { description: Updated milk, content: { application/json: { schema: { $ref: '#/components/schemas/Milk' } } } }
        "400": { description: ml must be positive }
        "404": { description: Not found }

  /api/library/recipe:
    post:
      tags: [Library]
      summary: Add a manual brew recipe
      description: "`id` is server-assigned and ignored if sent."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Recipe' }
      responses:
        "200": { description: Created recipe, content: { application/json: { schema: { $ref: '#/components/schemas/Recipe' } } } }
        "400": { description: name required }
        "429": { description: Rate limit exceeded }

  /api/library/recipe/{id}:
    put:
      tags: [Library]
      summary: Update a recipe
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Recipe' }
      responses:
        "200": { description: Updated recipe, content: { application/json: { schema: { $ref: '#/components/schemas/Recipe' } } } }
        "404": { description: Not found }

  /api/library/recipe/{id}/delete:
    post:
      tags: [Library]
      summary: Delete a recipe
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }

  /api/library/scan/{barcode}:
    get:
      tags: [Library]
      summary: Look up a product barcode via Open Food Facts (server-side proxy, CSP-blocked client-side)
      parameters:
        - { name: barcode, in: path, required: true, schema: { type: string, pattern: '^(\d{8}|\d{12}|\d{13}|\d{14})$' } }
      responses:
        "200":
          description: Matched product fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:    { type: string }
                  roaster: { type: string }
                  notes:   { type: string }
        "400": { description: Invalid barcode format }
        "404": { description: Product not found }
        "429": { description: Rate limit exceeded }
        "502": { description: Lookup failed (blocked address or upstream error) }

  # ── Maintenance ──────────────────────────────────────────────────────────

  /api/maintenance:
    get:
      tags: [Maintenance]
      summary: Maintenance state with computed stats, for one machine or all machines
      description: >
        Static tasks: `descaling`, `backflush`, `grouphead`, `gaskets`, `waterfilter`.
        Dynamic grinder tasks use the key `grinder_{id}`. `?machineId=all`
        (#392) returns the distinct MaintenanceAllMachinesStats shape instead
        (per-machine-scoped tasks grouped under `machines[]`, shared-equipment
        tasks computed once under `global`). Omitted machineId defaults to 1
        (the default machine) for backward compatibility with older clients.
      parameters:
        - { name: machineId, in: query, schema: { oneOf: [{ type: integer }, { type: string, enum: [all] }] } }
      responses:
        "200":
          description: Maintenance stats
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MaintenanceStats'
                  - $ref: '#/components/schemas/MaintenanceAllMachinesStats'

  /api/maintenance/{task}/done:
    post:
      tags: [Maintenance]
      summary: Mark a maintenance task as done today
      parameters:
        - name: task
          in: path
          required: true
          schema: { type: string }
          description: Task name (e.g. "descaling", "grinder_1716000000000")
        - { name: machineId, in: query, schema: { type: integer }, description: "Defaults to 1 (the default machine); 'all' is not accepted here, unlike GET /api/maintenance" }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { notes: { type: string } } }
      responses:
        "200": { description: Updated stats, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceStats' } } } }
        "404": { description: Unknown task, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/maintenance/{task}/threshold:
    post:
      tags: [Maintenance]
      summary: Update reminder thresholds for a maintenance task
      parameters:
        - name: task
          in: path
          required: true
          schema: { type: string }
        - { name: machineId, in: query, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                threshold_shots: { type: integer, minimum: 1, maximum: 10000, nullable: true }
                threshold_days:  { type: integer, minimum: 1, maximum: 365, nullable: true }
      responses:
        "200": { description: Updated stats, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceStats' } } } }
        "404": { description: Unknown task, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/maintenance/log:
    get:
      tags: [Maintenance]
      summary: Maintenance log entries (#393)
      parameters:
        - { name: machineId, in: query, schema: { type: integer }, description: "Omitted or 'all' returns every machine's entries" }
      responses:
        "200": { description: Array of log entries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MaintenanceLogEntry' } } } } }
    post:
      tags: [Maintenance]
      summary: Add a maintenance log entry (without necessarily marking the task done)
      parameters:
        - { name: machineId, in: query, schema: { type: integer }, description: "Defaults to 1" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task]
              properties:
                task:  { type: string }
                date:  { type: string, format: date }
                notes: { type: string, maxLength: 500 }
      responses:
        "200": { description: Created entry, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceLogEntry' } } } }
        "400": { description: Invalid task or date }

  /api/maintenance/log/{id}:
    delete:
      tags: [Maintenance]
      summary: Delete a maintenance log entry
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        "400": { description: Invalid id }
        "404": { description: Not found }

  # ── Orders ───────────────────────────────────────────────────────────────

  /api/orders:
    get:
      tags: [Orders]
      summary: List orders (most recent first, max 100)
      description: >
        Requires `enable_orders: true` in add-on config, otherwise returns 404.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, accepted, done, declined] }
        - name: machine
          in: query
          schema: { type: integer }
          description: "Scope to one machine's orders by its registry id (#326). Omitted = all machines."
      responses:
        "200":
          description: Array of orders
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Order' } }
        "404": { description: Orders feature not enabled }
    post:
      tags: [Orders]
      summary: Place a new order
      description: >
        `haUserId` should be supplied by the glp-integration proxy via the
        `X-GLP-HA-User-ID` header (injected from the authenticated HA session).
        The header value takes precedence over the body field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item, customer]
              properties:
                item:          { type: string, description: Must match a menu item name }
                customer:      { type: string, maxLength: 50 }
                note:          { type: string, maxLength: 200 }
                variant:       { type: string, description: Selected variant, if the menu item has any }
                notifyService: { type: string, description: "notify.* service to receive status updates for this order" }
                haUserId:      { type: string, maxLength: 100, description: Overridden by X-GLP-HA-User-ID header if present }
                machine:       { type: string, maxLength: 100, description: "Optional machine name/slug target (#317/glp-order-card #29). Resolved server-side (#326) into machineId against the machine registry — falls back to the default machine when unset or unmatched." }
                beanId:        { type: integer, description: "Optional library bean id for stable order-to-bean attribution (#563, glp-order-card #35). Resolved server-side against the library's actual beans — a stale/unknown id becomes null rather than failing order placement." }
      responses:
        "200": { description: Created order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        "400": { description: Validation error }
        "429": { description: Rate limit exceeded }
        "503": { description: Orders disabled }

  /api/orders/mine:
    get:
      tags: [Orders]
      summary: Orders placed by a specific HA user (max 10, most recent first)
      description: >
        The `X-GLP-HA-User-ID` header, when present, is preferred over the
        `haUserId` query parameter (same precedence as `POST /api/orders`,
        #547). The query parameter is only used as a fallback in direct-port
        mode, where there is no HA proxy to set the header. At least one of
        the two must resolve to a non-empty value.
      parameters:
        - name: haUserId
          in: query
          required: false
          description: Fallback when the `X-GLP-HA-User-ID` header isn't set.
          schema: { type: string }
      responses:
        "200":
          description: Array of orders
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Order' } }
        "400": { description: haUserId required }

  /api/orders/{id}/accept:
    post:
      tags: [Orders]
      summary: Accept a pending order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                eta: { type: integer, minimum: 1, maximum: 60, description: Estimated minutes, default 5 }
      responses:
        "200": { description: Updated order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        "400": { description: Order not in pending state }
        "404": { description: Not found }

  /api/orders/{id}/complete:
    post:
      tags: [Orders]
      summary: Mark an order as done (links the most recent shot)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Updated order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        "404": { description: Not found }

  /api/orders/{id}/decline:
    post:
      tags: [Orders]
      summary: Decline a pending or accepted order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        "200": { description: Updated order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        "400": { description: Cannot decline in current state }
        "404": { description: Not found }

  /api/orders/{id}:
    delete:
      tags: [Orders]
      summary: Delete a completed (done/declined) order from history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        "400": { description: Can only delete completed orders }
        "404": { description: Not found }

  /api/orders/history:
    delete:
      tags: [Orders]
      summary: Clear all completed (done/declined) orders from history
      responses:
        "200": { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }

  /api/orders/active-beans:
    get:
      tags: [Orders]
      summary: Beans from the coffee library that are still in stock
      description: >
        Stock-tracked beans whose active bag is not yet fully consumed
        (remaining = stock_g minus summed annotated doses since the active
        bag was opened). Used by the order card as bean variants.
      responses:
        "200":
          description: Array of in-stock beans
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:        { type: integer }
                    name:      { type: string }
                    roaster:   { type: string, nullable: true }
                    decaf:     { type: boolean }
                    remaining: { type: integer, description: Remaining grams in the active bag }
                    notes:     { type: string, nullable: true, description: Taste notes (customer-facing) }
                    origin:    { type: string, nullable: true }
                    process:   { type: string, nullable: true }
                    variety:   { type: string, nullable: true }

  /api/orders/active-milks:
    get:
      tags: [Orders]
      summary: Milks from the library available as order variants
      responses:
        "200":
          description: Array of milks
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Milk' } }

  /api/orders/milk-stock:
    get:
      tags: [Orders]
      summary: Milk stock with demand computed from currently pending/accepted orders
      responses:
        "200":
          description: Array of milks with demand/remaining
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Milk'
                    - type: object
                      properties:
                        demand:    { type: number, description: "ml requested by pending/accepted orders for this milk" }
                        remaining: { type: number, description: "max(0, stockMl - demand)" }

  /api/orders/queue-eta:
    get:
      tags: [Orders]
      summary: Estimated wait time for the current order queue
      parameters:
        - { name: machine, in: query, schema: { type: integer }, description: "Scope to one machine's queue by registry id (#326)" }
      responses:
        "200": { description: Queue ETA object (shape defined by OrderService.computeQueueEta) }

  /api/orders/stats:
    get:
      tags: [Orders]
      summary: Lifetime order stats (customers, most popular item, per-machine breakdown)
      description: >
        Reads from the unfiltered order table (not the 7-day live-queue
        window loadOrders() uses), so totals are true lifetime counts.
      parameters:
        - { name: machine, in: query, schema: { type: integer }, description: "Scope to one machine's stats by registry id (#326)" }
      responses:
        "200":
          description: Stats object
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  customers:
                    type: array
                    items:
                      type: object
                      properties:
                        name:    { type: string }
                        count:   { type: integer }
                        favItem: { type: string, nullable: true }
                        lastAt:  { type: integer, description: Unix ms }
                  mostPopular:
                    type: object
                    nullable: true
                    properties:
                      item:  { type: string }
                      count: { type: integer }
                  byMachine:
                    type: array
                    nullable: true
                    description: Only present once orders reference more than one machine.
                    items:
                      type: object
                      properties:
                        machineId:   { type: integer }
                        machineName: { type: string, nullable: true }
                        count:       { type: integer }

  /api/orders/menu:
    get:
      tags: [Orders]
      summary: Get the current menu
      responses:
        "200":
          description: Array of menu items
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MenuItem' } }
    post:
      tags: [Orders]
      summary: Add a menu item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:     { type: string, maxLength: 200 }
                emoji:    { type: string, maxLength: 10, default: "☕" }
                variants:
                  type: array
                  items: { type: string, maxLength: 50 }
                useBeans: { type: boolean }
                useMilks: { type: boolean }
      responses:
        "200": { description: Created item, content: { application/json: { schema: { $ref: '#/components/schemas/MenuItem' } } } }
        "400": { description: name required }

  /api/orders/menu/{id}:
    put:
      tags: [Orders]
      summary: Update a menu item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:     { type: string, maxLength: 200 }
                emoji:    { type: string, maxLength: 10 }
                trending: { type: boolean }
                variants:
                  type: array
                  items: { type: string, maxLength: 50 }
                useBeans: { type: boolean }
                useMilks: { type: boolean }
                milkMl:   { type: number, nullable: true }
      responses:
        "200": { description: Updated item, content: { application/json: { schema: { $ref: '#/components/schemas/MenuItem' } } } }
        "404": { description: Not found }
    delete:
      tags: [Orders]
      summary: Delete a menu item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        "404": { description: Not found }

  /api/orders/settings:
    get:
      tags: [Orders]
      summary: Get orders feature settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdersSettings' }
    post:
      tags: [Orders]
      summary: Enable or disable the orders feature, and configure notification toggles/recipients
      description: >
        Toggling `enabled` broadcasts a shop-open/shop-closed notification to
        `broadcastRecipients` (filtered to devices currently home, when HA
        person data is available), unless `notify_shop_state` is false.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrdersSettings' }
      responses:
        "200": { description: Updated settings, content: { application/json: { schema: { $ref: '#/components/schemas/OrdersSettings' } } } }
        "400": { description: enabled (boolean) required }

  /api/orders/notify-services:
    get:
      tags: [Orders]
      summary: List available HA notify services (requires SUPERVISOR_TOKEN)
      responses:
        "200":
          description: Array of service names
          content:
            application/json:
              schema: { type: array, items: { type: string }, example: ["notify.mobile_app_phone"] }

  /api/orders/notify-mapping:
    get:
      tags: [Orders]
      summary: Get the haUserId → notify service mapping
      responses:
        "200":
          description: Mapping + known customers
          content:
            application/json:
              schema:
                type: object
                properties:
                  mapping:
                    $ref: '#/components/schemas/NotifyMapping'
                  customers:
                    type: object
                    description: Map of haUserId → customer display name (derived from order history)
                    additionalProperties: { type: string }
    post:
      tags: [Orders]
      summary: Update the haUserId → notify service mapping
      description: >
        Send a partial map. Set a key to `""` to remove the mapping for that user.
        Only keys starting with `"notify."` are accepted (or empty string to delete).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotifyMapping' }
      responses:
        "200": { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }

  # ── System ───────────────────────────────────────────────────────────────

  /api/token:
    get:
      tags: [System]
      summary: Retrieve the API token
      security: []
      description: >
        Rate-limited (10/min per IP). Reverses the older HA-internal-only
        restriction (#533): a direct-port caller (not via HA Ingress) is
        rejected with 403 only when the add-on option `expose_api_port` has
        been explicitly set to `false` (default `true`, matching the
        historical always-open behavior — see #803 and the config.yaml
        option comment).
      responses:
        "200": { description: "{ apiToken: string|null }" }
        "403": { description: "Direct-port access disabled (expose_api_port=false); use HA Ingress" }
        "429": { description: Rate limit exceeded }

  /api/status:
    get:
      tags: [System]
      summary: Add-on status (public — no auth required)
      security: []
      description: >
        `?machineId=<id>` for a non-default machine scopes
        machineHostname/lastSync/lastSyncError/machineReachable to that
        machine via a live reachability probe, instead of describing the
        default machine (#464). Omitted, or a machineId that resolves back
        to the default machine, keeps the default-machine behavior
        byte-for-byte.
      parameters:
        - { name: machineId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Status object
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }

  /api/demo/seed:
    post:
      tags: [System]
      summary: Seed demo data (#274) — only allowed while the database is empty
      responses:
        "200": { description: "{ ok: true, isDemo: true }" }
        "409": { description: Database is not empty }
        "500": { description: Seeding failed }

  /api/demo/end:
    post:
      tags: [System]
      summary: Remove all demo data (#274)
      responses:
        "200": { description: "{ ok: true, isDemo: false }" }
        "500": { description: Removal failed }

  /api/sync:
    post:
      tags: [System]
      summary: Trigger a manual sync from the machine
      description: Rate-limited to one request per 30 seconds.
      responses:
        "200": { description: Sync triggered, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        "429": { description: Too soon since last manual sync }

  /api/switch:
    get:
      tags: [System]
      summary: Machine power switch state
      responses:
        "200":
          description: Switch state
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  entity:     { type: string, nullable: true }
                  state:      { type: boolean, nullable: true, description: true = on }

  /api/switch/toggle:
    post:
      tags: [System]
      summary: Toggle machine power switch (requires switch_entity + SUPERVISOR_TOKEN)
      responses:
        "200":
          description: New switch state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:    { type: boolean }
                  state: { type: boolean, description: New state after toggle }
        "400": { description: switch_entity not configured }
        "500": { description: HA call failed }

  /api/machine/status:
    get:
      tags: [System]
      summary: Default machine's latest cached live status (for glp-integration / Lovelace cards)
      description: >
        Polled every 5s by glp-integration's machine_coordinator.py. Always
        200 — `available: false` (with no other fields) means no status has
        been received yet since startup, rather than an error. `stale: true`
        once the cached status is more than 10 seconds old.
      responses:
        "200":
          description: Machine status
          content:
            application/json:
              schema:
                type: object
                required: [available]
                properties:
                  available: { type: boolean }
                  stale:     { type: boolean }
                  updatedAt: { type: integer, description: "Unix ms the status was last pushed, present only when available" }
                additionalProperties: true

  /api/machine/profiles:
    get:
      tags: [System]
      summary: Available machine profiles (name list), with a last-known cache fallback if the machine is unreachable
      parameters:
        - { name: machineId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Profile list
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:  { type: boolean }
                  stale:      { type: boolean, description: True when the list came from the last-known cache rather than a fresh fetch }
                  current:    { type: string, nullable: true }
                  currentId:  { type: integer, nullable: true }
                  options:    { type: array, items: { type: string } }
                  optionsRaw: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string } } } }

  /api/machine/profile/set:
    post:
      tags: [System]
      summary: Switch the active profile, by name or by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                option:    { type: string, description: Profile name — required unless `id` is given }
                id:        { type: integer, description: Profile id — takes precedence over `option` if both given }
                machineId: { type: integer }
      responses:
        "200": { description: "{ ok: true, profileId }" }
        "400": { description: Neither option nor id given }
        "404": { description: "No profile matches the given `option` name" }
        "500": { description: Machine call failed }

  /api/machine/profile/{id}:
    get:
      tags: [System]
      summary: Full detail of one machine profile (all phases), read directly over the machine's WebSocket/protobuf channel — no REST equivalent exists on the machine itself
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: machineId, in: query, schema: { type: integer } }
      responses:
        "200": { description: Profile detail (name, phases, globalStopConditions, waterTemperature, recipe) }
        "502": { description: Machine unreachable or returned an error }
    put:
      tags: [System]
      summary: Update an existing machine profile (name/phases/stop conditions), written over the machine's WebSocket/protobuf channel — the machine has no REST write endpoint
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MachineProfileInput'
                - type: object
                  properties: { machineId: { type: integer } }
      responses:
        "200": { description: "{ id, name } as confirmed by the machine", content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        "400": { description: "invalid profile (Zod validation failure — details include the issue list)" }
        "501": { description: "Machine type does not support remote profile editing (e.g. GaggiMate)" }
        "502": { description: Machine unreachable, returned an error, or did not confirm the update }
    delete:
      tags: [System]
      summary: Delete a machine profile, over the WebSocket/protobuf channel
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: machineId, in: query, schema: { type: integer }, description: "Also accepted in the request body" }
      responses:
        "200": { description: "{ ok: true, remaining: [...] }" }
        "501": { description: "Machine type does not support remote profile editing" }
        "502": { description: Machine unreachable or did not confirm deletion }

  /api/machine/profile:
    post:
      tags: [System]
      summary: Create a new machine profile, over the machine's WebSocket/protobuf channel — the machine has no REST write endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MachineProfileInput'
                - type: object
                  properties: { machineId: { type: integer } }
      responses:
        "200": { description: "{ id, name } — id is assigned by the machine" }
        "400": { description: "invalid profile (Zod validation failure — details include the issue list)" }
        "501": { description: "Machine type does not support remote profile editing (e.g. GaggiMate)" }
        "502": { description: Machine unreachable, returned an error, or did not confirm the create }

  /api/machine/settings:
    get:
      tags: [MachineControl]
      summary: Read the machine's settings (all categories, or one via ?category=)
      parameters:
        - { name: machineId, in: query, schema: { type: integer } }
        - { name: category, in: query, schema: { type: string, enum: [boiler, system, display, scales, led, theme, versions] } }
      responses:
        "200": { description: Settings object (shape mirrors the machine's own GET /api/settings/* response) }
        "400": { description: unknown category }
        "501": { description: machine type does not support the settings proxy }
        "502": { description: Machine unreachable or returned an error }

  /api/machine/settings/save:
    post:
      tags: [MachineControl]
      summary: Persist whatever settings are currently applied in RAM to flash (c_save_settings over WebSocket)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { machineId: { type: integer } } }
      responses:
        "200": { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        "501": { description: machine type does not support the settings proxy }
        "502": { description: Machine unreachable, timed out, or rejected the command }

  /api/machine/settings/{category}:
    post:
      tags: [MachineControl]
      summary: Update one settings category — proxies the machine's own POST /api/settings/{category}, which applies and persists in one call
      parameters:
        - { name: category, in: path, required: true, schema: { type: string, enum: [boiler, system, display, scales, led, theme] } }
      requestBody:
        content:
          application/json:
            schema: { type: object, description: "Full category payload (all fields from the matching GET response) — passed through as-is; machineId may be included alongside it" }
      responses:
        "200": { description: "{ success: true }" }
        "400": { description: unknown/read-only category, or invalid payload }
        "501": { description: machine type does not support the settings proxy }
        "502": { description: Machine unreachable or returned an error }

  /api/machine/opmode:
    post:
      tags: [MachineControl]
      summary: Switch operation mode (c_opmode over WebSocket)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { description: "OperationModeDto enum name or numeric value — BREW_MANUAL is rejected (live-verified no-op while idle)", oneOf: [{ type: string, enum: [BREW_AUTO, FLUSH, DESCALE, STEAM, FLUSH_AUTO, HOT_WATER, HOME] }, { type: integer }] }
                machineId: { type: integer }
      responses:
        "200": { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        "400": { description: invalid or unsupported mode }
        "501": { description: machine type does not support the settings proxy }
        "502": { description: Machine unreachable, timed out, or rejected the command }

  /api/machine/tare:
    post:
      tags: [MachineControl]
      summary: Request a scale tare (c_tare_pend over WebSocket)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { machineId: { type: integer } } }
      responses:
        "200": { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        "501": { description: machine type does not support the settings proxy }
        "502": { description: Machine unreachable, timed out, or rejected the command }

  /api/machine/service-test:
    post:
      tags: [MachineControl]
      summary: Briefly trigger a peripheral for the Maintenance page's component tests (c_service_test over WebSocket) — only works while the machine is idle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peripheral]
              properties:
                peripheral: { description: "ServiceTestPeripheralDto enum name or numeric value", oneOf: [{ type: string, enum: [PUMP, VALVE, VALVE_B, LED] }, { type: integer }] }
                machineId: { type: integer }
      responses:
        "200": { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        "400": { description: invalid peripheral }
        "501": { description: machine type does not support the settings proxy }
        "502": { description: Machine unreachable, timed out, or rejected (e.g. machine not idle) }

  /api/machine/profile/save:
    post:
      tags: [MachineControl]
      summary: Persist the currently active profile + its ID to flash (c_save_act_prof over WebSocket) — distinct from the saved-profile-slot CRUD under /api/machine/profile*
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { machineId: { type: integer } } }
      responses:
        "200": { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        "501": { description: machine type does not support the settings proxy }
        "502": { description: Machine unreachable, timed out, or rejected the command }

  /api/machine/firmware/progress:
    get:
      tags: [MachineControl]
      summary: Poll an in-flight firmware OTA update's progress
      parameters:
        - { name: machineId, in: query, schema: { type: integer } }
      responses:
        "200": { description: "{ progress, status: IDLE|IN_PROGRESS|SUCCESS|ERROR, type: C_FW|F_FW|F_FS }" }
        "501": { description: machine type does not support the settings proxy }
        "502": { description: Machine unreachable or returned an error }

  /api/machine/firmware/update:
    post:
      tags: [MachineControl]
      summary: Trigger a firmware OTA update from GitHub releases (ESP32 + STM32) — only starts the process, poll firmware/progress for status
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { machineId: { type: integer } } }
      responses:
        "200": { description: "{ message, success }" }
        "501": { description: machine type does not support the settings proxy }
        "502": { description: Machine unreachable or returned an error }

  /api/machine/firmware/version:
    get:
      tags: [MachineControl]
      summary: "Is a firmware update available? (#620 Phase 1) — compares the machine's installed commit-hash version against the latest matching GitHub release for its configured releaseChannel, cached hourly"
      parameters:
        - { name: machineId, in: query, schema: { type: integer } }
      responses:
        "200": { description: "{ installed, latest, updateAvailable, releaseUrl } — latest/releaseUrl are null when no matching release could be found" }
        "501": { description: machine type does not support the settings proxy }
        "502": { description: Machine unreachable, or the GitHub releases lookup failed }

  /api/machine/live:
    get:
      tags: [MachineControl]
      summary: Latest cached live sensor/system-state pushes from the machine's persistent WebSocket session
      parameters:
        - { name: machineId, in: query, schema: { type: integer } }
      responses:
        "200": { description: "{ sensorSnap: SensorStateSnapshotDto|null, sysState: SystemStateDto|null } — null until the machine's first push arrives" }
        "501": { description: machine type does not support the settings proxy }
        "502": { description: Machine unreachable or returned an error }

  /api/mqtt/discovery:
    get:
      tags: [Mqtt]
      summary: Supervisor MQTT service auto-discovery (requires services [mqtt:want] in config.yaml)
      responses:
        "200": { description: "{ available: false } or { available: true, host, port, username, password } from the Supervisor's /services/mqtt" }

  /api/mqtt/settings:
    get:
      tags: [Mqtt]
      summary: Current live-data transport settings (Settings-page WebSocket/MQTT toggle + broker connection)
      responses:
        "200": { description: "{ transport: 'websocket'|'mqtt', host, port, username, password, prefix }" }
    post:
      tags: [Mqtt]
      summary: Save the live-data transport settings. Drops any already-open MQTT session so a changed broker/prefix/credentials takes effect on the next read.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { transport: { type: string, enum: [websocket, mqtt] }, host: { type: string }, port: { type: integer }, username: { type: string }, password: { type: string }, prefix: { type: string } } }
      responses:
        "200": { description: Saved settings }
        "400": { description: Invalid settings payload }

  /api/mqtt/apply-to-machine:
    post:
      tags: [Mqtt]
      summary: One-click apply — points the default machine's own MQTT client (system.mqtt* settings, proxied by #597) at the already-saved broker, so the connection details don't need to be entered twice
      responses:
        "200": { description: Updated machine settings }
        "400": { description: No MQTT broker configured yet }
        "501": { description: machine type does not support the settings proxy }
        "502": { description: Machine unreachable or returned an error }

  /api/machines:
    get:
      tags: [Machines]
      summary: List all configured machines (#317). Seeds machine #1 from the legacy machine_host/switch_entity options on first call if the registry is still empty.
      responses:
        "200":
          description: Array of machines
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Machine' } }
    post:
      tags: [Machines]
      summary: Add a machine
      parameters:
        - { name: sync, in: query, schema: { type: string, enum: ["0", "false"] }, description: "Pass sync=0 to suppress the catch-up shot-history sync this save would otherwise trigger (#731 — used by the 'Verbindung testen' implicit save)" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MachineInput' }
      responses:
        "200": { description: Created machine, content: { application/json: { schema: { $ref: '#/components/schemas/Machine' } } } }
        "400": { description: Invalid machine payload, or host resolves to a private/blocked address }

  /api/machines/{id}:
    put:
      tags: [Machines]
      summary: Update a machine (partial update — omitted fields keep their current value)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: sync, in: query, schema: { type: string, enum: ["0", "false"] }, description: "Pass sync=0 to suppress the catch-up shot-history sync this save would otherwise trigger (#731)" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MachineInput' }
      responses:
        "200": { description: Updated machine }
        "400": { description: Invalid payload, or host resolves to a private/blocked address }
        "404": { description: Machine not found }
    delete:
      tags: [Machines]
      summary: Remove a machine. The default machine (isDefault true) cannot be deleted.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok: true }" }
        "400": { description: Attempted to delete the default machine }
        "404": { description: Machine not found }

  /api/machines/{id}/default:
    post:
      tags: [Machines]
      summary: Reassign which machine is the default (#753). Delete the now-non-default machine as a separate step if desired.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Updated machine, content: { application/json: { schema: { $ref: '#/components/schemas/Machine' } } } }
        "404": { description: Machine not found }

  /api/machines/{id}/test:
    post:
      tags: [Machines]
      summary: Reachability probe — connects to the machine via its adapter and reports live status or the connection error
      description: >
        Always responds 200 — a probe failure is reported as
        `{ reachable: false, error }` in the body, not as an HTTP error status.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ ok: true, reachable: boolean, status? , error? }" }
        "404": { description: Machine not found }

  /api/preheat:
    get:
      tags: [System]
      summary: Preheat progress and current boiler temperature (default machine only)
      responses:
        "200":
          description: Preheat status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreheatStatus' }

  /api/preheat/ready-by:
    post:
      tags: [System]
      summary: Set (or clear) a target "ready by" wall-clock time for automatic preheat scheduling
      description: |
        Backend capability for a future HA-integration service to schedule an automatic preheat
        switch-on so the machine is thermally ready by a target wall-clock time. The existing 30s
        preheat watcher computes `plannedSwitchOnAt = targetAt - preheat_time` and flips the
        configured switch on once that time is reached and the machine is off — one-shot, no
        re-fire. Rejected with 400 if `targetAt` is non-null and `switch_entity`/the HA token isn't
        configured, since the watcher could never fulfill it. `targetAt: null` always clears any
        pending target regardless of configuration state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetAt: { type: integer, nullable: true, description: Epoch-ms target time, or null to clear }
      responses:
        "200":
          description: Updated preheat status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreheatStatus' }
        "400": { description: "targetAt is not a valid epoch-ms number/null, or switch_entity/HA token isn't configured" }

  /api/live/data:
    get:
      tags: [System]
      summary: Live brew data (updated during active shot)
      description: Poll this endpoint during a shot to get real-time data. Check `seq` to detect updates.
      responses:
        "200":
          description: Live data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveData' }

  /api/events:
    get:
      tags: [System]
      summary: Server-Sent Events stream multiplexing every push event type over one connection (#735/#736)
      description: >
        text/event-stream. Event types: `sync-progress`, `sync-complete`,
        `live-snapshot` (LiveData), `preheat-update` (PreheatStatus). A newly
        connected client is primed with the current in-flight sync-progress
        (if any), plus one live-snapshot and one preheat-update, so it isn't
        waiting for the next natural trigger. A `:ping` comment line is sent
        every 20s as a keepalive; a leading padding comment (2048 spaces)
        forces an initial flush past HA Ingress buffering (#740). Existing
        polling endpoints (/api/status, /api/live/data, /api/preheat) stay
        available unchanged — the frontend falls back to polling them if this
        stream doesn't work. Not exposed in the OpenAPI response schemas
        below since this is a raw multiplexed text stream, not JSON.
        Auth: accepts either the usual `X-GLP-Token` header or, only on this
        route, the token as a `?token=` query parameter — EventSource can't
        set custom headers, so this is the one exception to header-only auth.
      security:
        - tokenAuth: []
        - tokenQueryAuth: []
      responses:
        "200":
          description: "text/event-stream — see event types above"
          content:
            text/event-stream:
              schema: { type: string }

  /api/menu:
    get:
      tags: [System]
      summary: Drink types for shot annotations (always available, independent of the orders feature/its own menu)
      security: []
      responses:
        "200":
          description: Array of drink types
          content:
            application/json:
              schema: { type: array, items: { type: object } }

  /api/version:
    get:
      tags: [System]
      summary: Add-on version and whether an update is available
      description: Cached/rate-limited by lib/version-check.js — see also the `up_to_date` achievement badge.
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:           { type: string }
                  latest:            { type: string, nullable: true }
                  update_available:  { type: boolean }
                  release_url:       { type: string, nullable: true }

  /api/achievements:
    get:
      tags: [System]
      summary: Achievement badge state + progress for the stamp card view (#812)
      parameters:
        - { name: lang, in: query, schema: { type: string, enum: [de, en, it, fr, es, nl], default: en } }
      responses:
        "200":
          description: Cards + badge state
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:  { type: array, items: { type: string }, description: Card layout key order }
                  badges:
                    type: array
                    description: >
                      Open badges carry name/description/stamp; secret badges
                      omit stamp/name/description until unlocked (see
                      lib/achievements/secrets.js).
                    items: { type: object }

  /api/debug/machine:
    get:
      tags: [System]
      summary: Raw response from the machine's /api/system/status (for debugging)
      description: Only registered when NODE_ENV !== 'production' (H2 — avoids leaking internal network topology on a real install).
      responses:
        "200":
          description: Debug info
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean }
                  baseUrl: { type: string }
                  data:    { type: object }
                  error:   { type: string }
        "404": { description: "Not registered (production build)" }

  /api/debug/export-db:
    get:
      tags: [System]
      summary: Download the raw SQLite database file (dev-channel only)
      description: >
        Gated on process.env.GLP_DEV_BUILD, only ever set for the dev-channel
        image — 404s exactly as if the route didn't exist at all on any real
        install, before touching the database. Checkpoints WAL first so the
        download reflects all committed writes.
      responses:
        "200":
          description: "SQLite database file (Content-Disposition attachment)"
          headers:
            Content-Length:
              description: Exact size of the database file in bytes (set after the WAL checkpoint) — the frontend uses it for a determinate download progress bar.
              schema: { type: integer }
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        "404": { description: "Not a dev-channel build — route does not exist" }
        "500": { description: Export failed }

  /api/debug/import-db:
    post:
      tags: [System]
      summary: Replace the entire glp.db file 1:1 from an uploaded SQLite file (dev-channel only)
      description: >
        Gated identically to GET /api/debug/export-db. The upload is
        streamed to a temp file and validated (SQLite magic-byte check,
        PRAGMA integrity_check, core-table schema probe) before anything
        touches the live database. Only on success is the current database
        backed up and the file swapped in; a rejected upload leaves the
        live database untouched. A restart is required to load the imported
        file (the running process keeps its old file descriptor).
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "200": { description: "{ ok: true, restartRequired: true, backupPath }" }
        "400": { description: "No file uploaded, not a SQLite database (magic-byte check), or the uploaded database failed validation (integrity_check / schema probe)" }
        "404": { description: "Not a dev-channel build — route does not exist" }
        "413": { description: "Uploaded file exceeds the 500 MB limit" }
        "500": { description: Import failed }

  /api/openapi.json:
    get:
      tags: [System]
      summary: This OpenAPI specification as JSON
      security: []
      responses:
        "200":
          description: OpenAPI 3.0.3 spec
          content:
            application/json:
              schema: { type: object }

  # ── Backup / Restore ─────────────────────────────────────────────────────

  /api/backup:
    get:
      tags: [Backup]
      summary: Download a full backup of all add-on data
      description: >
        Always the unscoped, all-sections, secrets-free export — for the
        selective/encrypted export, use the POST variant below. Kept as GET
        for any existing bookmark/tooling.
      responses:
        "200":
          description: Backup bundle (Content-Disposition attachment)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupBundle' }
    post:
      tags: [Backup]
      summary: Download a backup as a zip, optionally scoped to specific sections and/or including encrypted secrets
      description: >
        A passphrase must never travel in a URL, so it's only accepted here,
        in the request body — never as a query parameter. Unlike GET, this
        returns a zip archive (`backup.json` + real `images/<filename>`
        entries), the shape the app's own export UI consumes — not a single
        self-contained JSON object.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sections:
                  description: Omit for a full export (default); an empty array exports only the envelope.
                  type: array
                  items: { type: string, enum: [shots, maintenance, orders, machines, settings, secrets] }
                passphrase:
                  description: >
                    If given and non-empty, an encrypted `secrets` field
                    (API token + MQTT credentials) is added to the bundle —
                    only if 'secrets' is also in `sections` (or `sections`
                    is omitted).
                  type: string
      responses:
        "200":
          description: "Zip archive (Content-Disposition attachment): backup.json (BackupBundle, no embedded images) + images/<filename> entries"
          headers:
            X-GLP-Backup-Estimate:
              description: >
                Approximate upper-ish bound on the response body size in
                bytes (decimal ASCII, like Content-Length), for a
                client-side determinate progress bar. NOT exact — the body
                is DEFLATE-compressed and the per-shot term is a constant
                guess; clients clamp displayed progress at 99 % until the
                stream ends and treat a missing/zero/non-numeric value as
                indeterminate. Stat-only on the server (no image or shot
                row is opened to compute it).
              schema: { type: integer }
          content:
            application/zip:
              schema: { type: string, format: binary }

  /api/restore:
    post:
      tags: [Backup]
      summary: Restore add-on data from a backup bundle, or preview what a restore would do
      description: >
        Body limit is 50 MB. Rate-limited to 3 requests per minute per IP (a
        dry run is bucketed separately at 30/min, since the modal fires one
        per section-checkbox toggle). **Overwrites the sections selected by
        `sections` (or every section present in the file, if `sections` is
        omitted).** A section not selected is left completely untouched, not
        wiped. Accepts either the legacy self-contained `application/json`
        body (BackupBundle, images embedded as base64 — every backup before
        #658 used this shape, and it must keep working), or an
        `application/zip` body (the shape POST /api/backup produces) — for
        the zip form, `sections`/`dryRun`/`passphrase` travel as the
        `X-GLP-Sections` (JSON-encoded array), `X-GLP-Dry-Run` (`"true"`) and
        `X-GLP-Passphrase` headers respectively, never in the (binary) body
        or as query parameters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BackupBundle'
                - type: object
                  properties:
                    sections:
                      description: >
                        Which sections to actually apply. Omitted here falls
                        back to the bundle's own top-level `sections` field
                        (from a scoped export); omitted in both places means
                        every section present in the file.
                      type: array
                      items: { type: string, enum: [shots, maintenance, orders, machines, settings, secrets] }
                    passphrase:
                      description: Required to decrypt and apply `secrets`, if present and selected.
                      type: string
                    dryRun:
                      description: >
                        If true, runs every validation/sanitizer step a real
                        restore does and returns a preview — without writing
                        anything to the database or filesystem.
                      type: boolean
          application/zip:
            schema:
              type: string
              format: binary
              description: "backup.json + images/<filename> entries, as produced by POST /api/backup — sections/dryRun/passphrase via headers, see above"
      responses:
        "200":
          description: Restore result, or a dry-run preview if `dryRun` was true
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:     { type: boolean }
                  shots:  { type: integer, description: Number of shots restored (real restore only) }
                  secretsPresent:  { type: boolean, description: Whether the file had a `secrets` block and it was in the requested sections }
                  secretsRestored: { type: boolean, description: Whether the given passphrase actually decrypted it }
                  dryRun: { type: boolean }
                  preview:
                    description: Only present when `dryRun` was true.
                    type: object
                    properties:
                      shots:               { type: integer }
                      library:             { type: boolean }
                      maintenance:         { type: integer, description: Rows that would pass validation }
                      maintenanceTotal:    { type: integer, description: Rows present in the file, valid or not }
                      maintenanceLog:      { type: integer }
                      maintenanceLogTotal: { type: integer }
                      orders:              { type: integer }
                      ordersTotal:         { type: integer }
                      machines:            { type: integer }
                      settings:            { type: boolean }
                      images:              { type: integer }
                      secretsPresent:      { type: boolean }
                      secretsRestored:     { type: boolean }
                      sectionsPresent:
                        type: array
                        items: { type: string, enum: [shots, maintenance, orders, machines, settings, secrets] }
                        description: Which of the six domains actually have their defining key(s) present in the file, independent of `sections` filtering.
        "400": { description: "Invalid backup file (missing glp_backup/shots, too many shots, invalid zip, or invalid X-GLP-Sections header)" }
        "429": { description: Rate limit exceeded }

  # ── Import ───────────────────────────────────────────────────────────────

  /api/import/url:
    get:
      tags: [Import]
      summary: Import bean metadata from a product URL
      description: >
        HTTPS only. Tries, in order: (1) a registered provider — a built-in
        parser or a user-added custom-Shopify domain; (2) the generic
        Shopify `/products/<handle>.js` endpoint every Shopify storefront
        exposes; (3) JSON-LD Product markup; (4) OpenGraph/HTML meta tags.
        Steps 1–2 may fetch one extra bounded HTML page for enrichment
        (process/variety/producer/region) when the JSON left those fields
        empty (#423). Every fetch (initial URL and every redirect target) is
        SSRF-guarded.
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, format: uri }
        - { name: debug, in: query, schema: { type: string, enum: ["1"] }, description: "Attach a `_debug` diagnostic object to the response (#489)" }
      responses:
        "200":
          description: Extracted bean metadata (field set is a subset of the Bean schema, plus import-specific fields below)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Bean'
                  - type: object
                    properties:
                      importMethod: { type: string, description: "e.g. builtin:<id>, custom-shopify, generic-shopify, jsonld, opengraph" }
                      extraBrewRecipes:
                        type: array
                        items: { type: object }
                        description: Candidate recipes parsed from the page's brew-guide accordion, if any (#451).
                      duplicateWarning:
                        type: object
                        nullable: true
                        properties:
                          id:      { type: integer }
                          name:    { type: string }
                          roaster: { type: string }
                      _debug: { type: object, description: "Only present with ?debug=1" }
        "400": { description: "Missing/invalid url, unsupported protocol (non-https), or blocked address (SSRF guard)" }
        "404": { description: Product not found on page }
        "500": { description: Fetch failed }

  /api/import/settings:
    get:
      tags: [Import]
      summary: Import provider settings — built-in provider enable state + custom Shopify domains
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:         { type: string }
                        label:      { type: string }
                        hostSuffix: { type: string }
                        enabled:    { type: boolean }
                  customShopifyDomains:
                    type: array
                    items: { type: string }
    post:
      tags: [Import]
      summary: Update import provider settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                disabledProviders:
                  type: array
                  items: { type: string }
                  description: Built-in provider ids to disable — unknown ids are dropped, not rejected.
                customShopifyDomains:
                  type: array
                  maxItems: 20
                  items: { type: string, description: "Bare hostname — scheme/path/www. are stripped server-side; invalid domains are dropped, not rejected" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  disabledProviders:    { type: array, items: { type: string } }
                  customShopifyDomains: { type: array, items: { type: string } }

tags:
  - name: Shots
    description: Shot history — read, annotate, trash, restore, delete
  - name: Library
    description: Coffee bean and grinder library
  - name: Maintenance
    description: Maintenance task tracker with configurable thresholds
  - name: Orders
    description: Barista order system (requires enable_orders in add-on config)
  - name: System
    description: Add-on status, manual sync, machine switch, live data, preheat
  - name: Machines
    description: "Multi-machine registry (#317) — add/remove/test additional Gaggiuino or GaggiMate machines"
  - name: Backup
    description: Full backup and restore
  - name: Import
    description: Bean metadata import from external URLs
  - name: MachineControl
    description: "Gaggiuino settings/control/firmware proxy (#597) — Gaggiuino-only, 501s for machines without adapter.capabilities().settingsProxy"
  - name: Mqtt
    description: "MQTT live-data transport (#598) — Supervisor broker auto-discovery, the WebSocket/MQTT Settings-page toggle, and a one-click apply of the broker connection onto the machine's own MQTT client settings"
