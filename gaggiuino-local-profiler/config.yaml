name: "GLP — Gaggiuino Local Profiler"
version: "2.37.1"
slug: "gaggiuino_local_profiler"
description: "Local shot profiler for the Gaggiuino espresso machine — shot archive, coffee library with flavor wheel, analytics and optional order management, all local, no cloud."
url: "https://github.com/mxkissnr/gaggiuino-local-profiler"
image: "ghcr.io/mxkissnr/gaggiuino-local-profiler/{arch}"
arch:
  - amd64
  - armv7
  - aarch64
startup: application
boot: auto
homeassistant_api: true
# hassio_api: was kept from #330 (self-update button, removed by #516) and a
# Supervisor-token check (removed by #534) with no live use in between --
# but #598 gave it a real one: lib/mqtt-discovery.js calls the Supervisor's
# own /services/mqtt endpoint (SUPERVISOR_API, distinct from HA_API/
# homeassistant_api below, which only proxies the *Core* API) to
# auto-discover a registered MQTT broker. That endpoint is populated by the
# `services: - mqtt:want` declaration further down, and reading it requires
# this permission. #779 caught the previous version of this comment
# claiming no code path used it -- no longer true, don't remove this again
# without re-checking lib/mqtt-discovery.js first.
hassio_api: true
init: false
ingress: true
ingress_port: 8099
# #598: MQTT as an alternative live-data transport. "want" (not "need") —
# per the Supervisor add-on schema, "need" declares the service required for
# the add-on to work at all, which isn't true here: WebSocket stays the
# default transport and MQTT is opt-in from Settings, with manual host/port/
# user/pass entry as a fallback when no MQTT service is registered at all.
# "want" is enough to get the Supervisor's /services/mqtt endpoint
# (lib/mqtt-discovery.js) populated whenever an MQTT service (e.g. the
# Mosquitto broker add-on) *is* present.
services:
  - mqtt:want
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "GLP web interface (required for the companion HA integration)"
panel_icon: mdi:coffee
panel_title: "GLP"
# #662: machine_host/switch_entity are deprecated here (soft removal --
# removed from schema/options so the Configuration UI stops offering them;
# NOT removed from lib/machines/options-adoption.js's TRACKED list, which
# already treats an option absent from options.json as "never adopt" and
# was built with exactly this deprecation in mind, see that file's own
# comments). Machine #1 now configures like every other machine (#2+
# already worked this way) -- only in-app, via Settings -> Machines.
options:
  sync_interval: 5
  preheat_time: 20
  enable_orders: false
  debug_logging: false
  # #803: default true (open) so no existing install's behaviour changes on
  # upgrade -- see lib/data.js's isApiPortExposed() and routes/system.js's
  # GET /api/token. Turning this off returns 403 from that one endpoint for
  # any request that didn't arrive via HA Ingress; it does not unmap port
  # 8099 itself, and it does not narrow the trust boundary below the whole
  # Supervisor add-on network (isFromSupervisor() in server.js trusts all of
  # 172.30.0.0/16, not just the Ingress proxy). Breaks direct-port browser
  # access to the app entirely (this includes the installable PWA -- it's
  # just the installed form of the same UI), plus first-time setup of the
  # GLP Order Card's direct-URL mode, since none of those have any other way
  # to obtain a token (an already-configured Order Card that already has
  # glp_token in its YAML is unaffected). See DOCS.md's "Trust model" section.
  expose_api_port: true
schema:
  sync_interval: int(1,60)
  preheat_time: int(1,120)?
  enable_orders: bool?
  debug_logging: bool?
  expose_api_port: bool?
