name: "GLP — Gaggiuino Local Profiler"
version: "2.33.1"
slug: "gaggiuino_local_profiler"
description: "Local shot profiler for the Gaggiuino espresso machine — shot archive, coffee library with flavor wheel, analytics and optional order management, all local, no cloud."
url: "https://github.com/mxkissnr/gaggiuino-local-profiler"
image: "ghcr.io/mxkissnr/gaggiuino-local-profiler/{arch}"
arch:
  - amd64
  - armv7
  - aarch64
startup: application
boot: auto
homeassistant_api: true
# hassio_api: kept from #330, originally for the in-app self-update button
# (POST /addons/self/update), which #516 removed entirely. The comment that
# replaced it claimed hassio_api also backed a Supervisor-token verification
# check on /api/token — that's stale too: #534 dropped that check, and
# /api/token now serves any caller that can reach the port (see the trust
# model above GET /api/token in routes/system.js). No code path currently
# calls the Supervisor API; left set rather than removed as part of #546
# since dropping a permission grant is a separate change from this fix.
hassio_api: true
init: false
ingress: true
ingress_port: 8099
# #598: MQTT as an alternative live-data transport. "want" (not "need") —
# per the Supervisor add-on schema, "need" declares the service required for
# the add-on to work at all, which isn't true here: WebSocket stays the
# default transport and MQTT is opt-in from Settings, with manual host/port/
# user/pass entry as a fallback when no MQTT service is registered at all.
# "want" is enough to get the Supervisor's /services/mqtt endpoint
# (lib/mqtt-discovery.js) populated whenever an MQTT service (e.g. the
# Mosquitto broker add-on) *is* present.
services:
  - mqtt:want
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "GLP web interface (required for the companion HA integration)"
panel_icon: mdi:coffee
panel_title: "GLP"
# #662: machine_host/switch_entity are deprecated here (soft removal --
# removed from schema/options so the Configuration UI stops offering them;
# NOT removed from lib/machines/options-adoption.js's TRACKED list, which
# already treats an option absent from options.json as "never adopt" and
# was built with exactly this deprecation in mind, see that file's own
# comments). Machine #1 now configures like every other machine (#2+
# already worked this way) -- only in-app, via Settings -> Machines.
options:
  sync_interval: 5
  preheat_time: 20
  enable_orders: false
  debug_logging: false
schema:
  sync_interval: int(1,60)
  preheat_time: int(1,120)?
  enable_orders: bool?
  debug_logging: bool?
